                    divisions: (localPolicyData.standardDocs?.managerialRoles?.divisions || []).map((div) => {
                        if (div.id !== divisionId) return div;
                        return {
                            ...div,
                            roles: (div.roles || []).map((role) => (role.id === roleId ? { ...role, [field]: val } : role)),
                        };
                    }),
                });
            };

            const addMgrRole = (divisionId) => {
                const divisions = localPolicyData.standardDocs?.managerialRoles?.divisions || [];
                const div = divisions.find((d) => d.id === divisionId);
                const nextNum = `${div?.number || ''}.${(div?.roles || []).length + 1}`.replace(/^\./, '');
                const fresh = window.ManagerialRoles?.createEmptyRole?.({
                    number: nextNum,
                    title: 'New managerial role',
                }) || {
                    id: 'mgr-' + Date.now(),
                    number: nextNum,
                    title: 'New managerial role',
                    incumbent: '',
                    reportsTo: '',
                    directReports: '',
                    summary: '',
                    accountable: '',
                    responsible: '',
                    consulted: '',
                    informed: '',
                    specialAuthority: '',
                    approvalLimits: '',
                    responsibilities: '',
                };
                updateManagerialRoles({
                    divisions: divisions.map((d) => (d.id === divisionId ? { ...d, roles: [...(d.roles || []), fresh] } : d)),
                });
            };

            const removeMgrRole = (divisionId, roleId) => {
                updateManagerialRoles({
                    divisions: (localPolicyData.standardDocs?.managerialRoles?.divisions || []).map((div) => {
                        if (div.id !== divisionId) return div;
                        const nextRoles = (div.roles || []).filter((role) => role.id !== roleId);
                        const empty = window.ManagerialRoles?.createEmptyRole?.({ title: 'New managerial role' })
                            || { id: 'mgr-' + Date.now(), number: '', title: 'New managerial role', incumbent: '', reportsTo: '', directReports: '', summary: '', accountable: '', responsible: '', consulted: '', informed: '', specialAuthority: '', approvalLimits: '', responsibilities: '' };
                        return { ...div, roles: nextRoles.length ? nextRoles : [empty] };
                    }),
                });
            };

            const reorderMgrDivision = (idx, dir) => {
                const divisions = localPolicyData.standardDocs?.managerialRoles?.divisions || [];
                updateManagerialRoles({ divisions: moveArrayItem(divisions, idx, dir) });
            };

            const reorderMgrRole = (divisionId, idx, dir) => {
                updateManagerialRoles({
                    divisions: (localPolicyData.standardDocs?.managerialRoles?.divisions || []).map((div) =>
                        div.id === divisionId ? { ...div, roles: moveArrayItem(div.roles || [], idx, dir) } : div
                    ),
                });
            };

            const getActiveDocTitle = () => {
                if (activeMode === 'dashboard') return 'Workspace Dashboard';
                if (activeMode === 'sop') return activeSop?.title || 'Standard Operating Procedure';
                if (activeMode === 'jobDescriptions') return activeJobRole?.title || 'Job Role Profile';
                if (activeMode === 'handbook') return localPolicyData.handbook?.title || 'Employee Handbook';
                if (activeMode === 'branding') return 'Branding & Identity';
                if (activeMode === 'orgChart') return localPolicyData.standardDocs?.orgChart?.title || 'Organizational Structure & Reporting Policy';
                if (activeMode === 'raci') return localPolicyData.standardDocs?.raci?.title || 'RACI & Decision Authority';
                if (activeMode === 'communicationPlan') return localPolicyData.standardDocs?.communicationPlan?.title || 'Communication Plan';
                if (activeMode === 'managerialRoles') return localPolicyData.standardDocs?.managerialRoles?.title || 'Managerial Role Descriptions & Executive Specifications';
                return localPolicyData.standardDocs?.[activeMode]?.title || 'Document';
            };

            const compileActiveDocumentMarkdown = () => {
                if (activeMode === 'sop') {
                    const sop = activeSop;
                    if (!sop) return null;
                    let md = `# ${sop.title || 'Standard Operating Procedure'}\n\n`;
                    if (sop.docControl?.owner) md += `**Owner:** ${sop.docControl.owner}`;
                    if (sop.docControl?.version) md += ` · **Version:** ${sop.docControl.version}`;
                    if (sop.docControl?.effectiveDate) md += ` · **Effective:** ${sop.docControl.effectiveDate}`;
                    md += `\n\n`;
                    if (sop.objective) md += `## Purpose\n${sop.objective}\n\n`;
                    if (sop.scope) md += `## Applies to\n${sop.scope}\n\n`;
                    if (sop.prerequisites?.trim()) md += `## Before you start\n${sop.prerequisites}\n\n`;
                    if (sop.diagram?.svgCache) md += `## Process diagram\n![Process diagram](${sop.diagram.svgCache})\n\n`;
                    if (sop.steps?.length) {
                        md += `## Steps\n`;
                        sop.steps.forEach((step, idx) => {
                            md += `**${idx + 1}. ${step.action}**\n*Who: ${step.owner || '—'} · Time: ${step.duration || '—'}*\n${step.details || ''}\n\n`;
                        });
                    }
                    if (sop.kpis?.trim()) md += `## Done when\n${sop.kpis}\n\n`;
                    if (sop.troubleshooting?.trim()) md += `## If something goes wrong\n${sop.troubleshooting}\n\n`;
                    return md.trim();
                }
                if (activeMode === 'handbook') {
                    const hb = localPolicyData.handbook;
                    if (!hb) return null;
                    let md = `# ${hb.title || 'Employee Handbook'}\n\n`;
                    if (hb.introduction) md += `## Introduction\n${hb.introduction}\n\n`;
                    if (hb.timekeeping) md += `## Hours & Attendance\n${hb.timekeeping}\n\n`;
                    if (hb.compensation) md += `## Pay & Benefits\n${hb.compensation}\n\n`;
                    if (hb.offboarding) md += `## Resignation & Offboarding\n${hb.offboarding}\n\n`;
                    if (hb.leaves?.length) {
                        md += `## Leave\n`;
                        hb.leaves.forEach((l) => { md += `- **${l.name}** (${l.duration}): ${l.condition}\n`; });
                        md += `\n`;
                    }
                    if (hb.discipline?.length) {
                        md += `## Discipline\n`;
                        hb.discipline.forEach((d) => { md += `### ${d.level}\n**Action:** ${d.action}\n**Details:** ${d.details}\n\n`; });
                    }
                    if (hb.customPolicies?.length) {
                        md += `## Additional Policies\n`;
                        hb.customPolicies.forEach((cp) => { md += `### ${cp.title}\n${cp.text}\n\n`; });
                    }
                    if (hb.mission) md += `## Mission\n${hb.mission}\n\n`;
                    if (hb.vision) md += `## Vision\n${hb.vision}\n\n`;
                    return md.trim();
                }
                if (activeMode === 'jobDescriptions') {
                    if (!activeJobRole) return null;
                    return compileJobRoleMarkdown(migrateJobRoleFromContent(activeJobRole));
                }
                if (activeMode === 'orgChart') {
                    const orgDoc = localPolicyData.standardDocs?.orgChart;
                    if (!orgDoc) return null;
                    if (window.DiagramEditor?.compileOrgChartPolicyMarkdown) {
                        return window.DiagramEditor.compileOrgChartPolicyMarkdown(orgDoc);
                    }
                    return PC().compileStandardPolicyMarkdown?.(orgDoc) || `# ${orgDoc.title || 'Org Chart'}\n\n${orgDoc.introduction || ''}`;
                }
                if (activeMode === 'raci') {
                    const raciDoc = localPolicyData.standardDocs?.raci;
                    if (!raciDoc) return null;
                    if (window.RaciPolicy?.compileRaciPolicyMarkdown) {
                        return window.RaciPolicy.compileRaciPolicyMarkdown(raciDoc);
                    }
                    return `# ${raciDoc.title || 'RACI & Decision Authority'}\n\n${raciDoc.introduction || ''}`;
                }
                if (activeMode === 'communicationPlan') {
                    const commDoc = localPolicyData.standardDocs?.communicationPlan;
                    if (!commDoc) return null;
                    if (window.CommunicationPlan?.compileCommunicationPlanMarkdown) {
                        return window.CommunicationPlan.compileCommunicationPlanMarkdown(commDoc);
                    }
                    return `# ${commDoc.title || 'Communication Plan'}\n\n${commDoc.introduction || ''}`;
                }
                if (activeMode === 'managerialRoles') {
                    const mgrDoc = localPolicyData.standardDocs?.managerialRoles;
                    if (!mgrDoc) return null;
                    if (window.ManagerialRoles?.compileManagerialRolesMarkdown) {
                        return window.ManagerialRoles.compileManagerialRolesMarkdown(mgrDoc);
                    }
                    return `# ${mgrDoc.title || 'Managerial Role Descriptions'}\n\n${mgrDoc.introduction || ''}`;
                }
                if (localPolicyData.standardDocs?.[activeMode]) {
                    const doc = localPolicyData.standardDocs[activeMode];
                    return PC().compileStandardPolicyMarkdown?.(doc) || `# ${doc.title}\n\n${doc.introduction || ''}`;
                }
                return null;
            };

            const handleExportGoogleDoc = () => {
                if (activeMode === 'dashboard' || activeMode === 'branding') {
                    triggerToast('Open a policy document first, then export to Google Docs.');
                    return;
                }
                const title = getActiveDocTitle();
                const md = compileActiveDocumentMarkdown();
                if (!md || !String(md).trim()) {
                    triggerToast('Nothing to export in this document yet.');
                    return;
                }
                const exporter = window.GoogleDocExport;
                if (!exporter?.exportHtmlAsGoogleDoc) {
                    triggerToast('❌ Google Doc export helper failed to load. Refresh and try again.');
                    return;
                }
                const bodyHtml = renderMarkdown(md);
                const { filename } = exporter.exportHtmlAsGoogleDoc(title, bodyHtml, {
                    company: activeClient?.clientCompany || '',
                    subtitle: 'Exported from Policy Studio',
                });
                try {
                    window.open('https://drive.google.com/drive/u/0/my-drive', '_blank', 'noopener,noreferrer');
                } catch {
                    /* ignore popup blockers */
                }
                triggerToast(`📄 Downloaded ${filename} — upload to Drive → Open with Google Docs`);
            };

            const expandTextareasForPrint = () => {
                document.querySelectorAll('textarea').forEach((ta) => {
                    ta.style.height = 'auto';
                    ta.style.height = `${Math.max(ta.scrollHeight, 24)}px`;
                });
            };

            const handleExportPdf = () => {
                // Preview mode renders fields as full-height divs so multi-line RACI/DOA
                // sections are not clipped by collapsed textarea boxes in the print dialog.
                const restoreEditMode = isEditMode;
                const runPrint = () => {
                    expandTextareasForPrint();
                    let restored = false;
                    const restore = () => {
                        if (restored) return;
                        restored = true;
                        window.removeEventListener('afterprint', restore);
                        if (restoreEditMode) setIsEditMode(true);
                    };
                    window.addEventListener('afterprint', restore);
                    window.print();
                    // Only restore via afterprint — a short timeout can flip back to Edit Mode
                    // while the print dialog is still open and re-clip section content.
                };
                if (restoreEditMode) {
                    setIsEditMode(false);
                    setTimeout(runPrint, 80);
                } else {
                    runPrint();
                }
            };

            const activeProfile = useMemo(() => {
                if (isStandalone) return activeClient;
                return workbookProfiles.find(p => p.id === activeProfileId);
            }, [activeProfileId, workbookProfiles, isStandalone, activeClient]);

            const mod2Locked = MG().isMod2Locked?.(activeProfile, {
                standalone: isStandalone,
                profileId: activeProfileId,
                adminUnlock: adminMod2Unlock,
            }) ?? (!isStandalone && !MG().isMod1Complete?.(activeProfile));

            useEffect(() => {
                if (isStandalone || !activeProfileId) {
                    setAdminMod2Unlock(false);
                    return;
                }
                setAdminMod2Unlock(MG().hasAdminMod2Unlock?.(activeProfileId) ?? false);
            }, [activeProfileId, isStandalone]);

            const notifyMod2Locked = () => triggerToast(MOD2_LOCK_TOAST, 'lock');

            const handleAdminMod2Unlock = () => {
                if (!canAdminBypassMod2 || !activeProfileId) {
                    notifyMod2Locked();
                    return;
                }
                MG().setAdminMod2Unlock?.(activeProfileId, true);
                setAdminMod2Unlock(true);
                triggerToast('🔓 Policy Studio unlocked for this workspace (admin override)', 'warning');
            };

            const handleAdminMod2Relock = () => {
                if (!activeProfileId) return;
                MG().setAdminMod2Unlock?.(activeProfileId, false);
                setAdminMod2Unlock(false);
                triggerToast('🔒 Admin override cleared — Mod 1 delivery required', 'lock');
            };

            const runIfUnlocked = (action) => {
                if (mod2Locked) {
                    notifyMod2Locked();
                    return;
                }
                action();
            };

            const toastToneClass = {
                success: 'bg-brandTeal-600 border-brandTeal-400 text-white',
                error: 'bg-rose-600 border-rose-400 text-white',
                warning: 'bg-brandAmber-500 border-brandAmber-400 text-brandNavy-955',
                lock: 'bg-brandAmber-500 border-brandAmber-300 text-brandNavy-955 shadow-[0_0_24px_rgba(245,158,11,0.35)]',
            };
            const toastToneIcon = {
                success: '✓',
                error: '✕',
                warning: '⚠',
                lock: '🔒',
            };

            const renderDashboard = () => {
                if (!activeClient) return <div>Loading Data...</div>;

                const statusOf = (obj) => calculateDocStatus(obj?.docControl?.lastReviewed);

                const sopFiles = (localPolicyData.sops || []).map((sop, idx) => ({
                    id: `sop:${sop.id}`,
                    sopId: sop.id,
                    title: sop.title || `Procedure ${idx + 1}`,
                    blurb: sop.objective || 'Standard operating procedure',
                    obj: sop,
                }));
                const jobRoleFiles = (localPolicyData.standardDocs?.jobDescriptions?.sections || []).map((role, idx) => {
                    const normalized = migrateJobRoleFromContent(role);
                    return {
                        id: `jobRole:${normalized.id}`,
                        jobRoleId: normalized.id,
                        title: normalized.title || `Role Profile ${idx + 1}`,
                        blurb: normalized.purpose || [normalized.department, normalized.reportsTo ? `Reports to ${normalized.reportsTo}` : ''].filter(Boolean).join(' · ') || 'Job role profile',
                        obj: { docControl: localPolicyData.standardDocs?.jobDescriptions?.docControl },
                    };
                });

                const categories = getNavModel();
                const allTracked = [
                    ...sopFiles.map((f) => f.obj),
                    ...jobRoleFiles.map((f) => f.obj),
                    ...categories.flatMap((c) => c.items)
                        .filter((i) => i.kind === 'doc')
                        .map((i) => i.obj)
                        .filter(Boolean),
                ];
                const statusCounts = allTracked.reduce(
                    (acc, obj) => {
                        const s = statusOf(obj).status;
                        acc[s] = (acc[s] || 0) + 1;
                        return acc;
                    },
                    { 'Up to Date': 0, Draft: 0, 'Review Due': 0 }
                );

                const renderFileRow = (d) => {
                    const st = statusOf(d.obj);
                    return (
                        <div key={d.id} className="flex items-stretch border-b border-slate-100 last:border-b-0 group">
                            <button
                                type="button"
                                onClick={() => {
                                    if (d.sopId) openSopDocument(d.sopId);
                                    else if (d.jobRoleId) openJobRoleDocument(d.jobRoleId);
                                }}
                                className="min-w-0 flex-1 text-left flex items-start gap-3 px-4 py-3 hover:bg-slate-50 transition-colors"
                            >
                                <div className="min-w-0 flex-1">
                                    <div className="font-bold text-sm text-slate-800 group-hover:text-brandTeal-700 transition-colors truncate">{d.title}</div>
                                    {d.blurb && <div className="text-[11px] text-slate-500 mt-0.5 line-clamp-1">{d.blurb}</div>}
                                </div>
                                <div className="shrink-0 text-right">
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${st.bg} ${st.text}`}>{st.status}</span>
                                </div>
                            </button>
                        </div>
                    );
                };

                const renderDocRow = (item) => {
                    const st = statusOf(item.obj);
                    return (
                        <div key={item.id} className="flex items-stretch border-b border-slate-100 last:border-b-0 group/row">
                            <button
                                type="button"
                                onClick={() => openNavItem(item)}
                                className="min-w-0 flex-1 text-left flex items-start gap-3 px-4 py-3 hover:bg-slate-50 transition-colors"
                            >
                                <div className="min-w-0 flex-1">
                                    <div className="font-bold text-sm text-slate-800 group-hover/row:text-brandTeal-700 transition-colors truncate">{item.title}</div>
                                    {item.blurb && <div className="text-[11px] text-slate-500 mt-0.5 line-clamp-1">{item.blurb}</div>}
                                </div>
                                <div className="shrink-0 text-right">
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${st.bg} ${st.text}`}>{st.status}</span>
                                    <div className="text-[10px] text-slate-400 font-mono mt-1">v{item.obj?.docControl?.version || '1.0'}</div>
                                </div>
                            </button>
                            {isEditMode && (
                                <button
                                    type="button"
                                    title="Remove from this pack"
                                    aria-label={`Remove ${item.title}`}
                                    onClick={() => removePolicyDraft(item.key)}
                                    className="no-print shrink-0 px-3 text-rose-500 hover:bg-rose-50 border-l border-slate-100"
                                >
                                    <Icons.Trash />
                                </button>
                            )}
                        </div>
                    );
                };

                return (
                    <section aria-label="Workspace Dashboard" className="p-8 md:p-10 max-w-5xl">
                        <header className="mb-8 pb-6 border-b border-slate-200">
                            <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Policy pack</p>
                            <h2 className="font-black text-2xl text-slate-900 uppercase tracking-tight">{activeClient.clientCompany}</h2>
                            <p className="text-sm text-slate-500 mt-1 max-w-2xl">
                                Browse by category in the sidebar or open a draft below. Removed policies stay removed after you save.
                            </p>
                            <div className="flex flex-wrap items-center gap-x-4 gap-y-2 mt-4 text-[11px] font-semibold text-slate-600">
                                <span><span className="text-emerald-700">{statusCounts['Up to Date'] || 0}</span> up to date</span>
                                <span className="text-slate-300">·</span>
                                <span><span className="text-slate-700">{statusCounts.Draft || 0}</span> draft</span>
                                <span className="text-slate-300">·</span>
                                <span><span className="text-rose-700">{statusCounts['Review Due'] || 0}</span> review due</span>
                                <span className="text-slate-300">·</span>
                                <span>{sopFiles.length} SOPs · {jobRoleFiles.length} roles · {categories.length} categories</span>
                            </div>
                            <div className="flex flex-wrap gap-2 mt-4">
                                {isEditMode && (
                                    <button
                                        type="button"
                                        onClick={() => { setCatalogModalTab('add'); setShowCatalogModal(true); }}
                                        className="text-[11px] font-bold uppercase tracking-wider bg-brandTeal-600 text-white px-3 py-1.5 rounded hover:bg-brandTeal-500 transition-colors"
                                    >
                                        + Add policy
                                    </button>
                                )}
                                {isEditMode && (
                                    <button
                                        type="button"
                                        onClick={() => { setCatalogModalTab('categories'); setShowCatalogModal(true); }}
                                        className="text-[11px] font-bold uppercase tracking-wider bg-white border border-slate-300 text-slate-700 px-3 py-1.5 rounded hover:bg-slate-50 transition-colors"
                                    >
                                        Manage categories
                                    </button>
                                )}
                                <button type="button" onClick={() => setActiveMode('branding')} className="text-[11px] font-bold uppercase tracking-wider bg-white border border-slate-300 text-slate-700 px-3 py-1.5 rounded hover:bg-slate-50 transition-colors">
                                    Branding
                                </button>
                                {!isStandalone && (
                                    <React.Fragment>
                                        <button type="button" onClick={handleExportStandalone} className="text-[11px] font-bold uppercase tracking-wider bg-brandTeal-50 border border-brandTeal-200 text-brandTeal-800 px-3 py-1.5 rounded hover:bg-brandTeal-100 transition-colors flex items-center">
                                            <Icons.Archive /> Client vault file
                                        </button>
                                        <button type="button" onClick={() => setShowBulkResetModal(true)} className="text-[11px] font-bold uppercase tracking-wider bg-white border border-rose-200 text-rose-700 px-3 py-1.5 rounded hover:bg-rose-50 transition-colors flex items-center">
                                            <Icons.Reset /> Reset templates
                                        </button>
                                    </React.Fragment>
                                )}
                            </div>
                        </header>

                        <div className="space-y-8">
                            {categories.map((cat) => (
                                <section key={cat.id} aria-labelledby={`dash-cat-${cat.id}`}>
                                    <div className="mb-2 flex flex-wrap items-end justify-between gap-2">
                                        <div>
                                            <h3 id={`dash-cat-${cat.id}`} className="text-sm font-black uppercase tracking-wider text-slate-900">{cat.title}</h3>
                                            {cat.subtitle && <p className="text-xs text-slate-500 mt-0.5">{cat.subtitle}</p>}
                                        </div>
                                        <span className="text-[10px] font-mono text-slate-400">{cat.items.length} item{cat.items.length === 1 ? '' : 's'}</span>
                                    </div>
                                    <div className="border border-slate-200 rounded-xl overflow-hidden bg-white">
                                        {cat.items.length === 0 ? (
                                            <p className="px-4 py-4 text-xs text-slate-400 italic">No policies in this category yet.</p>
                                        ) : (
                                            cat.items.map((item) => {
                                                if (item.kind === 'group') {
                                                    const files = item.groupType === 'sops' ? sopFiles : jobRoleFiles;
                                                    return (
                                                        <div key={item.id} className="border-b border-slate-100 last:border-b-0">
                                                            <div className="px-4 py-3 flex flex-wrap items-center justify-between gap-2">
                                                                <button type="button" onClick={() => openNavItem(item)} className="text-left min-w-0">
                                                                    <div className="text-xs font-bold uppercase tracking-wider text-slate-800 hover:text-brandTeal-700">{item.title}</div>
                                                                    <div className="text-[11px] text-slate-500 mt-0.5">{files.length} file{files.length === 1 ? '' : 's'} · {item.blurb}</div>
                                                                </button>
                                                                <div className="flex flex-wrap gap-2">
                                                                    {isEditMode && item.groupType === 'sops' && (
                                                                        <button type="button" onClick={addSOP} className="text-[10px] font-bold uppercase tracking-wider text-brandTeal-700 bg-brandTeal-50 border border-brandTeal-200 px-2.5 py-1 rounded hover:bg-brandTeal-100">+ New SOP</button>
                                                                    )}
                                                                    {isEditMode && item.groupType === 'jobs' && (
                                                                        <button type="button" onClick={addJobRole} className="text-[10px] font-bold uppercase tracking-wider text-brandTeal-700 bg-brandTeal-50 border border-brandTeal-200 px-2.5 py-1 rounded hover:bg-brandTeal-100">+ New role</button>
                                                                    )}
                                                                    {isEditMode && (
                                                                        <button type="button" onClick={() => removePolicyDraft(item.key)} className="text-[10px] font-bold uppercase tracking-wider text-rose-600 bg-white border border-rose-200 px-2.5 py-1 rounded hover:bg-rose-50">Remove</button>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            {files.length > 0 ? (
                                                                <div className="border-t border-slate-100 bg-slate-50/40">{files.map(renderFileRow)}</div>
                                                            ) : (
                                                                <p className="px-4 py-3 text-xs text-slate-400 italic border-t border-slate-100">No files yet — add one to get started.</p>
                                                            )}
                                                        </div>
                                                    );
                                                }
                                                return renderDocRow(item);
                                            })
                                        )}
                                    </div>
                                </section>
                            ))}
                        </div>
                    </section>
                );
            };

            const renderStandardEditor = (docKey) => {
                const rawDoc = localPolicyData.standardDocs?.[docKey];
                if (!rawDoc || !activeClient) return null;
                const usesChapters = usesChaptersForKey(docKey);
                const doc = usesChapters && PC().normalizeStandardPolicyDoc
                    ? PC().normalizeStandardPolicyDoc(rawDoc)
                    : rawDoc;
                const chapters = usesChapters ? (doc.chapters || []) : null;
                const sectionsList = usesChapters
                    ? (PC().tocEntries?.(doc) || [{ title: 'Introduction', kind: 'intro', number: '' }, ...(doc.sections || [])])
                    : (PC().tocEntriesFlat?.(doc) || [
                        { title: 'Introduction', kind: 'intro', number: '' },
                        ...(doc.sections || []).map((s, i) => ({ ...s, kind: 'section', number: `${i + 1}.` })),
                    ]);
                const canImportDoc = isEditMode && STANDARD_DOCS_WITH_GDOC_IMPORT.includes(docKey);

                return (
                    <React.Fragment>
                        {canImportDoc && (
                            <tr className="block print:table-row no-print">

                                <div className="flex justify-between items-center border-b border-brandNavy-800 pb-3">
                                    <div className="flex items-center gap-2 text-rose-400">
                                        <Icons.Reset />
                                        <h3 className="text-sm font-bold uppercase tracking-widest text-white">Reset Document to Template</h3>
                                    </div>
                                    <button onClick={() => setShowResetConfirmModal(false)} className="text-slate-400 hover:text-white transition-colors cursor-pointer"><Icons.Close /></button>
                                </div>
                                
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    Are you sure you want to reset <strong>{getActiveDocTitle()}</strong> to the default compliance template? This will replace your current edits with the latest system draft.
                                </p>

                                <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg text-rose-300 text-[11px] leading-relaxed font-semibold">
                                    ⚠️ Warning: This action is local and temporary until you click "Save to Cloud". If you proceed and save, your previous custom edits for this document will be permanently overwritten.
                                </div>

                                <div className="pt-2 border-t border-brandNavy-800 flex justify-end gap-2">
                                    <button onClick={() => setShowResetConfirmModal(false)} className="px-4 py-1.5 bg-brandNavy-900 hover:bg-brandNavy-850 text-xs font-bold uppercase rounded border border-brandNavy-800 text-slate-300">Cancel</button>
                                    <button onClick={handleResetToDefault} className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-xs font-bold uppercase rounded text-white shadow-lg transition-all">Reset to Template</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bulk Workspace Reset Confirmation Modal */}
                    {showBulkResetModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm no-print" onPointerDown={() => setShowBulkResetModal(false)}>
                            <div 
                                className="w-[480px] bg-brandNavy-955 border border-brandNavy-800 border-t-4 border-t-rose-600 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] p-6 text-left animate-pop-in text-white font-sans flex flex-col gap-4"
                                onPointerDown={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center border-b border-brandNavy-800 pb-3">
                                    <div className="flex items-center gap-2 text-rose-505">
                                        <Icons.Reset />
                                        <h3 className="text-sm font-bold uppercase tracking-widest text-white">Reset All Workspace Documents</h3>
                                    </div>
                                    <button onClick={() => setShowBulkResetModal(false)} className="text-slate-400 hover:text-white transition-colors cursor-pointer"><Icons.Close /></button>
                                </div>
                                
                                <p className="text-xs text-slate-400 leading-relaxed font-semibold">
                                    This action will reset ALL 10 policy documents in this active workspace (SOPs, Handbook, Conduct, NDA, BCP, SLA, etc.) back to their latest system-defined compliance drafts.
                                </p>

                                <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg text-rose-300 text-[11px] leading-relaxed font-semibold">
                                    ⚠️ Critical Warning: This operation applies to all policies simultaneously. To write these updates to the cloud, you must click "Save to Cloud" after resetting. This is ideal if you have older workspaces that you want to upgrade to our brand-new comprehensive templates.
                                </div>

                                <div className="pt-2 border-t border-brandNavy-800 flex justify-end gap-2">
                                    <button onClick={() => setShowBulkResetModal(false)} className="px-4 py-1.5 bg-brandNavy-900 hover:bg-brandNavy-850 text-xs font-bold uppercase rounded border border-brandNavy-800 text-slate-300">Cancel</button>
                                    <button onClick={handleBulkResetToDefault} className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-xs font-bold uppercase rounded text-white shadow-lg transition-all">Reset All to Templates</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
