            const iframeRef = useRef(null);
            const readyRef = useRef(false);
            const configuredRef = useRef(false);
            const pendingXmlRef = useRef(xml);

            const postAction = (payload) => {
                iframeRef.current?.contentWindow?.postMessage(JSON.stringify(payload), '*');
            };

            const sendLoad = (diagramXml) => {
                const blank = preset === 'bpmn'
                    ? (window.DiagramEditor?.BLANK_BPMN_XML || '')
                    : (window.DiagramEditor?.BLANK_ORG_CHART_XML || '');
                postAction({
                    action: 'load',
                    xml: diagramXml || blank,
                    autosave: 1,
                });
            };

                postAction({
                    action: 'export',
                    format,
                    xml: format === 'xml',
                    spin: 'Exporting diagram…',
                });
            };

            useEffect(() => {
                pendingXmlRef.current = xml;
                if (readyRef.current && configuredRef.current) sendLoad(xml);
            }, [xml]);

                const handler = (evt) => {
                    if (!evt.data || typeof evt.data !== 'string') return;
                    let msg;
                    try { msg = JSON.parse(evt.data); } catch { return; }

                    if (msg.event === 'configure') {
                        configuredRef.current = true;
                        postAction({
                            action: 'configure',
                            config: window.DiagramEditor?.getPreset(preset)?.configure || {},
                        });
                    }
                    if (msg.event === 'init') {
                        readyRef.current = true;
                        sendLoad(pendingXmlRef.current);
                    }
                    if (msg.event === 'export') {
                        if (msg.format === 'xml' && msg.xml && onXmlChange) onXmlChange(msg.xml);
                        if ((msg.format === 'xmlsvg' || msg.format === 'svg') && msg.data && onSvgExport) onSvgExport(msg.data);
                    }
                    if (msg.event === 'autosave' && msg.xml && onXmlChange) onXmlChange(msg.xml);
                };
                window.addEventListener('message', handler);
                return () => window.removeEventListener('message', handler);
            }, [preset, onXmlChange, onSvgExport]);

                [newArr[index], newArr[index - 1]] = [newArr[index - 1], newArr[index]];
            } else if (direction === 1 && index < newArr.length - 1) {
                [newArr[index], newArr[index + 1]] = [newArr[index + 1], newArr[index]];
            }
            return newArr;
        };

                const mod = e.metaKey || e.ctrlKey;

                const key = e.key.toLowerCase();
                if (key === 'b') {
                    e.preventDefault();
                    runFormat('bold');
                } else if (key === 'i') {
                    e.preventDefault();
                    runFormat('italic');
                } else if (key === 'k') {

                    runFormat('link');
                } else if (e.shiftKey && key === '8') {

                    runFormat('bullet');

                    runFormat('number');

                if(!e.target.files[0]) return;
                const reader = new FileReader();

                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let scaleSize = 1;
                        if(img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const ta = textareaRef.current;
                        const raw = String(value || '');
                        const pos = ta ? ta.selectionStart : raw.length;

                    img.src = e.target.result;

                const policyCatalog = PCat().mergePolicyCatalog

                const sopSource = Array.isArray(loadedData.sops) ? loadedData.sops : defaultData.sops;
                const mergedSops = sopSource.map((loaded) =>
                    window.SopSync?.mergeSopDocument?.(sopTemplate, loaded) || loaded
                );

                const mergedHandbook = {
                    ...defaultData.handbook,
                    ...(loadedData.handbook || {}),
                    docControl: {
                        ...defaultData.handbook.docControl,
                        ...(loadedData.handbook?.docControl || {})
                    },
                    leaves: Array.isArray(loadedData.handbook?.leaves)
                        ? loadedData.handbook.leaves
                        : defaultData.handbook.leaves,
                    discipline: Array.isArray(loadedData.handbook?.discipline)
                        ? loadedData.handbook.discipline
                        : defaultData.handbook.discipline,
                    customPolicies: Array.isArray(loadedData.handbook?.customPolicies)
                        ? loadedData.handbook.customPolicies
                        : (loadedData.customPolicies || defaultData.handbook.customPolicies)
                };

                const mergeOneStandardDoc = (key, defaultDoc, loadedDoc) => {
                    const loaded = loadedDoc && typeof loadedDoc === 'object' ? loadedDoc : {};
                    if (key === 'orgChart' && window.DiagramEditor?.mergeOrgChartPolicy) {
                        return window.DiagramEditor.mergeOrgChartPolicy(defaultDoc, loaded);
                    }
                    if (key === 'raci' && window.RaciPolicy?.mergeRaciPolicy) {
                        return window.RaciPolicy.mergeRaciPolicy(defaultDoc, loaded);
                    }
                    if (key === 'communicationPlan' && window.CommunicationPlan?.mergeCommunicationPlan) {
                        return window.CommunicationPlan.mergeCommunicationPlan(defaultDoc, loaded);
                    }
                    if (key === 'managerialRoles' && window.ManagerialRoles?.mergeManagerialRoles) {
                        return window.ManagerialRoles.mergeManagerialRoles(defaultDoc, loaded);
                    }
                    // Prefer loaded sections when the array exists (including empty).
                    const sectionsSource = Array.isArray(loaded.sections)
                        ? loaded.sections
                        : (defaultDoc?.sections || []);
                    const chaptersSource = Array.isArray(loaded.chapters)
                        ? loaded.chapters
                        : (Array.isArray(defaultDoc?.chapters) ? defaultDoc.chapters : null);
                    let mergedDoc = {
                        ...(defaultDoc || {}),
                        ...loaded,
                        docControl: {
                            ...((defaultDoc && defaultDoc.docControl) || {}),
                            ...(loaded.docControl || {})
                        },
                        sections: key === 'jobDescriptions'
                            ? (sectionsSource || []).map((sec) => migrateJobRoleFromContent(sec))
                            : sectionsSource,
                    };
                    delete mergedDoc.chapters;
                    if (Array.isArray(chaptersSource) && chaptersSource.length) {
                        mergedDoc.chapters = chaptersSource;
                    }
                    if (docUsesChapters(key, policyCatalog) && PC().normalizeStandardPolicyDoc) {
                        if (!loaded.chapters?.length && (loaded.sections?.length || mergedDoc.sections?.length)) {
                            delete mergedDoc.chapters;
                        }
                        mergedDoc = PC().normalizeStandardPolicyDoc(mergedDoc);
                    }
                    return mergedDoc;
                };

                const mergedStandardDocs = {};
                Object.keys(defaultData.standardDocs).forEach((key) => {
                    if (removedDefaults.has(key)) return;
                    mergedStandardDocs[key] = mergeOneStandardDoc(
                        key,
                        defaultData.standardDocs[key],
                        loadedData.standardDocs?.[key]
                    );
                });

                // Custom drafts from catalog
                (policyCatalog.customDocs || []).forEach((custom) => {
                    const key = custom.key;
                    if (!key || mergedStandardDocs[key]) return;
                    const fallback = PCat().createEmptyCustomPolicyDoc
                        ? PCat().createEmptyCustomPolicyDoc({ title: custom.title, kind: custom.kind })
                        : { title: custom.title || 'Custom Policy', docControl: {}, introduction: '', sections: [] };
                    mergedStandardDocs[key] = mergeOneStandardDoc(
                        key,
                        fallback,
                        loadedData.standardDocs?.[key]
                    );
                });

                // Migrate legacy orgChart.raciMatrix → standardDocs.raci (one-time on load)
                const legacyOrgRaci = loadedData.standardDocs?.orgChart?.raciMatrix;
                const raciDoc = mergedStandardDocs.raci;
                const loadedRaci = loadedData.standardDocs?.raci || {};
                const raciHasCustom = (Array.isArray(loadedRaci.matrices) && loadedRaci.matrices.length > 0)
                    || (Array.isArray(loadedRaci.matrix) && loadedRaci.matrix.length > 0);
                if (!removedDefaults.has('raci') && Array.isArray(legacyOrgRaci) && legacyOrgRaci.length && !raciHasCustom && window.RaciPolicy?.mergeRaciPolicy) {
                    mergedStandardDocs.raci = window.RaciPolicy.mergeRaciPolicy(raciDoc || {}, {
                        ...(raciDoc || {}),
                        matrix: legacyOrgRaci,
                    });
                }
                if (mergedStandardDocs.orgChart?.raciMatrix) {
                    const { raciMatrix: _drop, ...orgClean } = mergedStandardDocs.orgChart;
                    mergedStandardDocs.orgChart = orgClean;
                }

                return {
                    sops: mergedSops,
                    handbook: mergedHandbook,
                    standardDocs: mergedStandardDocs,
                    policyCatalog,
                };
            };

            // Handle Document Loading when Profile ID changes
            useEffect(() => {
                if (isStandalone || !user || !activeProfileId) return;
                
                const docRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', 'policy_documents', activeProfileId);
                
                const unsub = window.onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setLocalPolicyData(mergePolicyData(docSnap.data()));
                    } else {
                        setLocalPolicyData(JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA)));
                    }
                });
                
                return () => unsub();
            }, [activeProfileId, user, isStandalone]);

            // Keep the active SOP file selection valid as the SOP list changes
            useEffect(() => {
                const sops = localPolicyData.sops || [];
                if (!sops.length) {
                    if (activeSopId) setActiveSopId(null);
                    return;
                }
                if (!activeSopId || !sops.some((s) => s.id === activeSopId)) {
                    setActiveSopId(sops[0].id);
                }
            }, [localPolicyData.sops, activeSopId]);

            // Keep the active Job Role Profile file selection valid
            useEffect(() => {
                const roles = localPolicyData.standardDocs?.jobDescriptions?.sections || [];
                if (!roles.length) {
                    if (activeJobRoleId) setActiveJobRoleId(null);
                    return;
                }
                if (!activeJobRoleId || !roles.some((r) => r.id === activeJobRoleId)) {
                    setActiveJobRoleId(roles[0].id);
                }
            }, [localPolicyData.standardDocs?.jobDescriptions?.sections, activeJobRoleId]);

            // If the open draft was removed from the catalog, return to the dashboard.
            useEffect(() => {
                if (!activeMode || activeMode === 'dashboard' || activeMode === 'branding') return;
                const catalog = PCat().mergePolicyCatalog
                    ? PCat().mergePolicyCatalog(DEFAULT_DOCUMENT_DATA.policyCatalog, localPolicyData.policyCatalog)
                    : (localPolicyData.policyCatalog || DEFAULT_DOCUMENT_DATA.policyCatalog);
                const removed = new Set(catalog?.removedDefaults || []);
                const modeKey = activeMode === 'sop' ? 'sops' : activeMode;
                if (removed.has(modeKey)) {
                    setActiveMode('dashboard');
                    return;
                }
                const customKeys = new Set((catalog?.customDocs || []).map((d) => d.key));
                const builtin = new Set(PCat().BUILTIN_KEYS || []);
                const special = new Set(['sop', 'handbook', 'jobDescriptions']);
                if (!builtin.has(modeKey) && !special.has(activeMode) && !customKeys.has(activeMode) && !localPolicyData.standardDocs?.[activeMode]) {
                    setActiveMode('dashboard');
                }
            }, [activeMode, localPolicyData.policyCatalog, localPolicyData.standardDocs]);

            const inferToastTone = (msg) => {
                const text = String(msg || '');
                if (text.includes('🔒') || /locked|Complete Mod 1/i.test(text)) return 'lock';
                if (text.startsWith('❌')) return 'error';
                if (text.startsWith('⚠')) return 'warning';
                return 'success';
            };

            const triggerToast = (msg, tone) => {
                const resolvedTone = tone || inferToastTone(msg);
                setToast({ message: msg, tone: resolvedTone });
                setTimeout(() => setToast(null), resolvedTone === 'lock' ? 4500 : 3000);
            };

            /** Firestore rejects undefined field values — omit them recursively before setDoc. */
            const stripUndefinedDeep = (value) => {
                if (Array.isArray(value)) {
                    return value.map((item) => stripUndefinedDeep(item));
                }
                if (value !== null && typeof value === 'object') {
                    const out = {};
                    Object.entries(value).forEach(([key, nested]) => {
                        if (nested === undefined) return;
                        out[key] = stripUndefinedDeep(nested);
                    });
                    return out;
                }
                return value;
            };

            const handleSaveToCloud = async () => {
                if (isStandalone) {
                    triggerToast("💾 Saved Locally! Standalone portal operates completely client-side.");
                    return;
                }
                if (authError) {
                    triggerToast("❌ Cloud Sync Disabled (GCP API Key Restricts Null Referrers)");
                    return;
                }
                if (!isAuthed || !activeProfileId) return;
                if (mod2Locked) return triggerToast(MOD2_LOCK_TOAST, 'lock');
                setIsSaving(true);
                try {
                    const policyRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', 'policy_documents', activeProfileId);
                    const payload = stripUndefinedDeep(localPolicyData);
                    await window.setDoc(policyRef, payload);
                    
                    const profileRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', 'workbook_profiles', activeProfileId);
                    
                    await window.setDoc(profileRef, stripUndefinedDeep({
                        clientCompany: activeClient.clientCompany,
                        clientRep: activeClient.clientRep,
                        sponsorTitle: activeClient.sponsorTitle,
                        policySignatoryName: activeClient.policySignatoryName,
                        policySignatoryTitle: activeClient.policySignatoryTitle,
                        branding: activeClient.branding
                    }), { merge: true });

                    if (window.PortalSync?.syncProfileToPortalIfExists) {
                        try {
                            const profileSnap = await window.getDoc(profileRef);
                            const profileData = profileSnap.exists()
                                ? { id: activeProfileId, ...profileSnap.data() }
                                : { id: activeProfileId, clientCompany: activeClient.clientCompany, clientRep: activeClient.clientRep };
                            await window.PortalSync.syncProfileToPortalIfExists(profileData);
                        } catch (portalErr) {
                            console.warn('Portal sync skipped:', portalErr);
                        }
                    }

                    triggerToast("💾 Synced to Cloud!");
                } catch (e) {
                    console.error("Save error:", e);
                    const detail = String(e?.message || e?.code || '').trim();
                    const short = detail.length > 120 ? `${detail.slice(0, 117)}…` : detail;
                    triggerToast(short ? `❌ Error saving to cloud: ${short}` : "❌ Error saving to cloud.");
                }
                setIsSaving(false);
            };

            // --- EXPORT CLIENT STANDALONE HUD ENGINE (FETCH CLONING DESIGN) ---
            const handleExportStandalone = async () => {
                if (isStandalone) return;
                setIsSaving(true);
                try {
                    // Pull current HTML source file
                    const response = await fetch(window.location.href);
                    let htmlText = await response.text();
                    
                    // Bundle current snapshot variables safely
                    const brandingJSON = JSON.stringify(activeClient, null, 2);
                    const policyDataJSON = JSON.stringify(localPolicyData, null, 2);

                    const dataPayload = `
    <!-- INJECTED OFFLINE DATA BLOCKS -->
    <script>
        window.STANDALONE_CLIENT = ${brandingJSON};
        window.STANDALONE_POLICIES = ${policyDataJSON};
    <\/script>
                    `;
                    
                    // Inject static data blocks into head tag of cloned build
                    htmlText = htmlText.replace('<head>', '<head>' + dataPayload);
                    
                    // Build standalone HTML blob
                    const blob = new Blob([htmlText], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${activeClient.clientCompany.replace(/[^a-z0-9]/gi, '_')}_Compliance_Portal.html`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    triggerToast("📦 Standalone Client Portal Generated!");
                } catch (e) {
                    console.error("Compile failure:", e);
                    triggerToast("❌ Error compiling standalone portal.");
                }
                setIsSaving(false);
            };

            const compilePoliciesForVault = () => {
                const policiesArray = [];
                const defaultDate = new Date().toISOString().split('T')[0];
                const catalog = PCat().mergePolicyCatalog
                    ? PCat().mergePolicyCatalog(DEFAULT_DOCUMENT_DATA.policyCatalog, localPolicyData.policyCatalog)
                    : (localPolicyData.policyCatalog || DEFAULT_DOCUMENT_DATA.policyCatalog);
                const removedDefaults = new Set(catalog?.removedDefaults || []);

                if (!removedDefaults.has('sops') && localPolicyData.sops) {
                    localPolicyData.sops.forEach(sop => {
                        let mdContent = `# ${sop.title}\n\n`;
                        if (sop.docControl?.owner) mdContent += `**Owner:** ${sop.docControl.owner}`;
                        if (sop.docControl?.version) mdContent += ` · **Version:** ${sop.docControl.version}`;
                        if (sop.docControl?.effectiveDate) mdContent += ` · **Effective:** ${sop.docControl.effectiveDate}`;
                        mdContent += `\n\n`;
                        if (sop.objective) mdContent += `## Purpose\n${sop.objective}\n\n`;
                        if (sop.scope) mdContent += `## Applies to\n${sop.scope}\n\n`;
                        if (sop.prerequisites?.trim()) mdContent += `## Before you start\n${sop.prerequisites}\n\n`;
                        if (sop.diagram?.svgCache) mdContent += `## Process diagram\n![Process diagram](${sop.diagram.svgCache})\n\n`;
                        if (sop.steps && sop.steps.length > 0) {
                            mdContent += `## Steps\n`;
                            sop.steps.forEach((step, idx) => {
                                mdContent += `**${idx + 1}. ${step.action}**\n*Who: ${step.owner || '—'} · Time: ${step.duration || '—'}*\n${step.details || ''}\n\n`;
                            });
                        }
                        if (sop.kpis?.trim()) mdContent += `## Done when\n${sop.kpis}\n\n`;
                        if (sop.troubleshooting?.trim()) mdContent += `## If something goes wrong\n${sop.troubleshooting}\n\n`;
                        if (sop.raci && (sop.raci.responsible || sop.raci.accountable)) {
                            mdContent += `## Roles (RACI)\n`;
                            mdContent += `- **Responsible:** ${sop.raci.responsible || '—'}\n`;
                            mdContent += `- **Accountable:** ${sop.raci.accountable || '—'}\n`;
                            if (sop.raci.consulted) mdContent += `- **Consulted:** ${sop.raci.consulted}\n`;
                            if (sop.raci.informed) mdContent += `- **Informed:** ${sop.raci.informed}\n`;
                            mdContent += `\n`;
                        }

                        policiesArray.push({
                            id: sop.id || makeSopId(),
                            title: sop.title || 'Standard Operating Procedure',
                            content: mdContent.trim(),
                            lastUpdated: sop.docControl?.lastReviewed || defaultDate
                        });
                    });
                }

                if (!removedDefaults.has('handbook') && localPolicyData.handbook) {
                    let mdContent = `# ${localPolicyData.handbook.title || 'Employee Handbook'}\n\n`;
                    if (localPolicyData.handbook.introduction) mdContent += `## Introduction\n${localPolicyData.handbook.introduction}\n\n`;
                    if (localPolicyData.handbook.timekeeping) mdContent += `## Hours & Attendance\n${localPolicyData.handbook.timekeeping}\n\n`;
                    if (localPolicyData.handbook.compensation) mdContent += `## Pay & Benefits\n${localPolicyData.handbook.compensation}\n\n`;
                    if (localPolicyData.handbook.offboarding) mdContent += `## Resignation & Offboarding\n${localPolicyData.handbook.offboarding}\n\n`;

                    if (localPolicyData.handbook.leaves && localPolicyData.handbook.leaves.length > 0) {
                        mdContent += `## Leave\n`;
                        localPolicyData.handbook.leaves.forEach(l => {
                            mdContent += `- **${l.name}** (${l.duration}): ${l.condition}\n`;
                        });
                        mdContent += `\n`;
                    }

                    if (localPolicyData.handbook.discipline && localPolicyData.handbook.discipline.length > 0) {
                        mdContent += `## Discipline\n`;
                        localPolicyData.handbook.discipline.forEach(d => {
                            mdContent += `### ${d.level}\n**Action:** ${d.action}\n**Details:** ${d.details}\n\n`;
                        });
                    }

                    if (localPolicyData.handbook.customPolicies && localPolicyData.handbook.customPolicies.length > 0) {
                        mdContent += `## Additional Policies\n`;
                        localPolicyData.handbook.customPolicies.forEach(cp => {
                            mdContent += `### ${cp.title}\n${cp.text}\n\n`;
                        });
                    }

                    if (localPolicyData.handbook.mission) mdContent += `## Mission\n${localPolicyData.handbook.mission}\n\n`;
                    if (localPolicyData.handbook.vision) mdContent += `## Vision\n${localPolicyData.handbook.vision}\n\n`;

                    policiesArray.push({
                        id: 'doc-handbook',
                        title: localPolicyData.handbook.title || 'Employee Handbook',
                        content: mdContent.trim(),
                        lastUpdated: localPolicyData.handbook.docControl?.lastReviewed || defaultDate
                    });
                }

                if (localPolicyData.standardDocs) {
                    Object.keys(localPolicyData.standardDocs).forEach(key => {
                        if (key === 'orgChart' || key === 'raci' || key === 'communicationPlan' || key === 'managerialRoles') return;
                        if (removedDefaults.has(key)) return;
                        const doc = localPolicyData.standardDocs[key];

                        // Job Role Profiles: one vault file per role
                        if (key === 'jobDescriptions') {
                            const roles = doc.sections || [];
                            if (!roles.length) {
                                policiesArray.push({
                                    id: 'doc-jobDescriptions',
                                    title: doc.title || 'Role Alignment Profile Guides',
                                    content: `# ${doc.title || 'Role Alignment Profile Guides'}\n\n${doc.introduction || ''}`.trim(),
                                    lastUpdated: doc.docControl?.lastReviewed || defaultDate
                                });
                                return;
                            }
                            roles.forEach((role, idx) => {
                                const normalized = migrateJobRoleFromContent(role);
                                policiesArray.push({
                                    id: normalized.id || `doc-jobDescriptions-${idx + 1}`,
                                    title: normalized.title || `Role Profile ${idx + 1}`,
                                    content: compileJobRoleMarkdown(normalized),
                                    lastUpdated: doc.docControl?.lastReviewed || defaultDate
                                });
                            });
                            return;
                        }

                        let mdContent = PC().compileStandardPolicyMarkdown
                            ? PC().compileStandardPolicyMarkdown(doc)
                            : (() => {
                                let md = `# ${doc.title || 'Standard Document'}\n\n`;
                                if (doc.introduction) md += `## Introduction\n${doc.introduction}\n\n`;
                                if (doc.sections && doc.sections.length > 0) {
                                    doc.sections.forEach((sec, idx) => {
                                        md += `## ${idx + 1}. ${sec.title}\n${sec.content}\n\n`;
                                    });
                                }
                                return md.trim();
                            })();

                        policiesArray.push({
                            id: `doc-${key}`,
                            title: doc.title || 'Standard Document',
                            content: mdContent,
                            lastUpdated: doc.docControl?.lastReviewed || defaultDate
                        });
                    });
                }

                if (!removedDefaults.has('orgChart') && localPolicyData.standardDocs?.orgChart && window.DiagramEditor?.compileOrgChartPolicyMarkdown) {
                    const orgDoc = localPolicyData.standardDocs.orgChart;
                    policiesArray.push({
                        id: 'doc-orgChart',
                        title: orgDoc.title || 'Organizational Structure & Reporting Policy',
                        content: window.DiagramEditor.compileOrgChartPolicyMarkdown(orgDoc),
                        lastUpdated: orgDoc.docControl?.lastReviewed || defaultDate
                    });
                }

                if (!removedDefaults.has('raci') && localPolicyData.standardDocs?.raci && window.RaciPolicy?.compileRaciPolicyMarkdown) {
                    const raciDoc = localPolicyData.standardDocs.raci;
                    policiesArray.push({
                        id: 'doc-raci',
                        title: raciDoc.title || 'RACI & Decision Authority',
                        content: window.RaciPolicy.compileRaciPolicyMarkdown(raciDoc),
                        lastUpdated: raciDoc.docControl?.lastReviewed || defaultDate
                    });
                }

                if (!removedDefaults.has('communicationPlan') && localPolicyData.standardDocs?.communicationPlan && window.CommunicationPlan?.compileCommunicationPlanMarkdown) {
                    const commDoc = localPolicyData.standardDocs.communicationPlan;
                    policiesArray.push({
                        id: 'doc-communicationPlan',
                        title: commDoc.title || 'Communication Plan',
                        content: window.CommunicationPlan.compileCommunicationPlanMarkdown(commDoc),
                        lastUpdated: commDoc.docControl?.lastReviewed || defaultDate
                    });
                }

                if (!removedDefaults.has('managerialRoles') && localPolicyData.standardDocs?.managerialRoles && window.ManagerialRoles?.compileManagerialRolesMarkdown) {
                    const mgrDoc = localPolicyData.standardDocs.managerialRoles;
                    policiesArray.push({
                        id: 'doc-managerialRoles',
                        title: mgrDoc.title || 'Managerial Role Descriptions & Executive Specifications',
                        content: window.ManagerialRoles.compileManagerialRolesMarkdown(mgrDoc),
                        lastUpdated: mgrDoc.docControl?.lastReviewed || defaultDate
                    });
                }

                return policiesArray;
            };

            const handlePublishToVault = async () => {
                if (isStandalone || authError || !isAuthed || !activeProfileId) return;
                setIsPublishing(true);
                try {
                    const policies = compilePoliciesForVault();
                    for (const policy of policies) {
                        const vaultRef = window.doc(window.firebaseDb, 'artifacts', window.appId, 'public', 'data', 'core_policies', policy.id);
                        await window.setDoc(vaultRef, policy, { merge: true });
                    }
                    if (window.logAudit) {
                        await window.logAudit('policy_vault_publish', { profileId: activeProfileId, count: policies.length });
                    }
                    triggerToast(`📋 Published ${policies.length} policies to Workspace Vault`);
                } catch (e) {
                    console.error('Vault publish error:', e);
                    triggerToast('❌ Failed to publish policies to Vault.');
                }
                setIsPublishing(false);
            };

            // --- EXPORT JSON FOR MASTER ADMIN CONSOLE IMPORTER ---
            const handleExportJSON = () => {
                try {
                    const policiesArray = compilePoliciesForVault();
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(policiesArray, null, 2));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    const clientName = activeClient?.clientCompany ? activeClient.clientCompany.replace(/[^a-z0-9]/gi, '_') : 'Workspace';
                    downloadAnchorNode.setAttribute("download", `${clientName}_Policies_Export.json`);
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                    
                    triggerToast("📄 JSON Policies Exported!");
                } catch(e) {
                    console.error("Export Error: ", e);
                    triggerToast("❌ Failed to export JSON.");
                }
            };

            // Individual document template re-initialization
            const handleResetToDefault = () => {
                if (activeMode === 'sop') {
                    const template = JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA.sops[0]));
                    const sops = localPolicyData.sops || [];
                    if (!activeSopId || !sops.some((s) => s.id === activeSopId)) {
                        const fresh = { ...template, id: makeSopId() };
                        setLocalPolicyData((prev) => ({ ...prev, sops: [fresh] }));
                        setActiveSopId(fresh.id);
                    } else {
                        setLocalPolicyData((prev) => ({
                            ...prev,
                            sops: (prev.sops || []).map((s) => (s.id === activeSopId ? { ...template, id: s.id } : s)),
                        }));
                    }
                    triggerToast('🔄 This SOP file reinitialized to default template! Remember to save changes.');
                } else if (activeMode === 'jobDescriptions') {
                    const templates = (DEFAULT_DOCUMENT_DATA.standardDocs.jobDescriptions.sections || []).map((sec) =>
                        migrateJobRoleFromContent(JSON.parse(JSON.stringify(sec)))
                    );
                    const templateRole = templates[0] || createEmptyJobRole({ title: 'New Job Role Profile' });
                    const roles = localPolicyData.standardDocs?.jobDescriptions?.sections || [];
                    if (!activeJobRoleId || !roles.some((r) => r.id === activeJobRoleId)) {
                        const fresh = { ...templateRole, id: makeJobRoleId() };
                        setLocalPolicyData((prev) => ({
                            ...prev,
                            standardDocs: {
                                ...prev.standardDocs,
                                jobDescriptions: {
                                    ...JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA.standardDocs.jobDescriptions)),
                                    ...(prev.standardDocs?.jobDescriptions || {}),
                                    sections: [fresh],
                                },
                            },
                        }));
                        setActiveJobRoleId(fresh.id);
                    } else {
                        const matchIdx = roles.findIndex((r) => r.id === activeJobRoleId);
                        const roleTemplate = templates[matchIdx] || templateRole;
                        setLocalPolicyData((prev) => ({
                            ...prev,
                            standardDocs: {
                                ...prev.standardDocs,
                                jobDescriptions: {
                                    ...prev.standardDocs.jobDescriptions,
                                    sections: (prev.standardDocs.jobDescriptions?.sections || []).map((r) =>
                                        r.id === activeJobRoleId ? { ...roleTemplate, id: r.id } : r
                                    ),
                                },
                            },
                        }));
                    }
                    triggerToast('🔄 This Job Role Profile file reinitialized to default template! Remember to save changes.');
                } else if (activeMode === 'handbook') {
                    setLocalPolicyData(prev => ({
                        ...prev,
                        handbook: JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA.handbook))
                    }));
                    triggerToast("🔄 Employee Handbook reinitialized to default template! Remember to save changes.");
                } else if (localPolicyData.standardDocs?.[activeMode]) {
                    const customMeta = (getPolicyCatalog().customDocs || []).find((d) => d.key === activeMode);
                    const template = DEFAULT_DOCUMENT_DATA.standardDocs[activeMode]
                        ? JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA.standardDocs[activeMode]))
                        : (PCat().createEmptyCustomPolicyDoc
                            ? PCat().createEmptyCustomPolicyDoc({
                                title: customMeta?.title || localPolicyData.standardDocs[activeMode]?.title || 'New Policy Draft',
                                kind: customMeta?.kind || 'chapters',
                            })
                            : { title: 'New Policy Draft', docControl: {}, introduction: '', sections: [] });
                    setLocalPolicyData(prev => ({
                        ...prev,
                        standardDocs: {
                            ...prev.standardDocs,
                            [activeMode]: template
                        }
                    }));
                    triggerToast(`🔄 ${getActiveDocTitle()} reinitialized to default template! Remember to save changes.`);
                }
                setShowResetConfirmModal(false);
            };

            // Global workspace migration to latest compliance templates
            const handleBulkResetToDefault = () => {
                const prevCatalog = localPolicyData.policyCatalog;
                const customBodies = {};
                (prevCatalog?.customDocs || []).forEach((d) => {
                    if (localPolicyData.standardDocs?.[d.key]) {
                        customBodies[d.key] = localPolicyData.standardDocs[d.key];
                    }
                });
                const fresh = JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA));
                // Preserve catalog tombstones/customs so deleted drafts do not reappear.
                setLocalPolicyData(mergePolicyData({
                    sops: (prevCatalog?.removedDefaults || []).includes('sops') ? [] : fresh.sops,
                    handbook: fresh.handbook,
                    standardDocs: { ...fresh.standardDocs, ...customBodies },
                    policyCatalog: prevCatalog || fresh.policyCatalog,
                }));
                triggerToast("🔄 Active templates refreshed. Removed drafts stay removed — save to commit.");
                setShowBulkResetModal(false);
            };

            // --- SYNC WORKFLOW DIAGRAM AS SOP MANUAL ---
            const handleSyncSopFromTab = (tab) => {
                const profile = workbookProfiles.find(p => p.id === activeProfileId);
                const newSop = window.SopSync?.buildSopFromWorkflowTab?.(tab, profile);
                if (!newSop) {
                    triggerToast('⚠️ This BPMN diagram has no tasks to import. Add BPMN task shapes in Workflow Builder first.');
                    return;
                }

                setLocalPolicyData(prev => {
                    const filtered = (prev.sops || []).filter(s => s.title.toLowerCase() !== tab.name.toLowerCase());
                    return { ...prev, sops: [...filtered, newSop] };
                });

                openSopDocument(newSop.id);
                setShowSyncModal(false);
                triggerToast(`🔄 Successfully synchronized "${tab.name}" as an SOP (diagram + ${newSop.steps?.length || 0} steps).`);
            };

            const updateSopFields = (sopId, patch) => updateDocState('sops', (sops) => sops.map((s) => {
                if (s.id !== sopId) return s;
                return {
                    ...s,
                    ...patch,
                    diagram: patch.diagram ? { ...(s.diagram || {}), ...patch.diagram } : s.diagram,
                    link: patch.link ? { ...(s.link || {}), ...patch.link } : s.link,
                };
            }));

            const handleSopDiagramXmlChange = (sopId, drawioXml) => {
                updateSopFields(sopId, {
                    diagram: { drawioXml, lastDiagramEditAt: Date.now() },
                    link: { source: 'policy-studio' },
                });
            };

            const handleSopSvgExport = (sopId, svgCache) => {
                updateSopFields(sopId, { diagram: { svgCache } });
            };

            const handleSyncSopFromWorkspace = (sopId) => {
                const sop = (localPolicyData.sops || []).find((s) => s.id === sopId);
                const profile = workbookProfiles.find((p) => p.id === activeProfileId);
                if (!sop || !profile) {
                    triggerToast('⚠️ Select a workspace profile first.');
                    return;
                }
                const synced = window.SopSync?.syncSopFromWorkspace?.(sop, profile);
                if (!synced) {
                    triggerToast('⚠️ No matching Mod 2 workflow tab with BPMN tasks. Build the to-be diagram in Workflow Builder first.');
                    return;
                }
                updateDocState('sops', (sops) => sops.map((s) => (s.id === sopId ? synced : s)));
                triggerToast(`✅ "${synced.title}" synced from workspace (${synced.steps?.length || 0} steps).`);
            };

            const handleParseStepsFromSopDiagram = (sopId) => {
                const sop = (localPolicyData.sops || []).find((s) => s.id === sopId);
                const profile = workbookProfiles.find((p) => p.id === activeProfileId);
                const refreshed = window.SopSync?.refreshSopStepsFromDiagram?.(sop, profile);
                if (!refreshed) {
                    triggerToast('⚠️ This diagram has no BPMN tasks to parse.');
                    return;
                }
                updateDocState('sops', (sops) => sops.map((s) => (s.id === sopId ? refreshed : s)));
                triggerToast(`✅ Parsed ${refreshed.steps?.length || 0} steps from diagram.`);
            };

            const updateActiveClientField = (field, value) => {
                setActiveClient(prev => ({ ...prev, [field]: value }));
            };

            const updateActiveClientBranding = (field, value) => {
                setActiveClient(prev => ({ ...prev, branding: { ...prev.branding, [field]: value } }));
            };

            const updateDocState = (domain, pathFn) => {
                setLocalPolicyData(prev => ({ ...prev, [domain]: pathFn(prev[domain]) }));
            };

            // SOP Handlers — each SOP is a separate document/file
            const addSOP = () => {
                const template = JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA.sops[0]));
                const fresh = {
                    ...template,
                    id: makeSopId(),
                    title: 'New Standard Operating Procedure',
                    docControl: {
                        ...(template.docControl || {}),
                        version: '1.0',
                        effectiveDate: '',
                        lastReviewed: '',
                        owner: template.docControl?.owner || '',
                    },
                    steps: (template.steps || []).map((st, idx) => ({
                        ...st,
                        id: `step-${Date.now()}-${idx}`,
                    })),
                    diagram: { drawioXml: '', svgCache: '', lastDiagramEditAt: null },
                    link: { source: 'policy-studio', workbookWorkflowField: 'workflowBuilder', lastSyncedAt: null },
                };
                updateDocState('sops', (sops) => [...(sops || []), fresh]);
                openSopDocument(fresh.id);
            };
            const deleteSOP = (id) => {
                const remaining = (localPolicyData.sops || []).filter((s) => s.id !== id);
                updateDocState('sops', () => remaining);
                if (activeSopId === id) {
                    if (remaining[0]) openSopDocument(remaining[0].id);
                    else {
                        setActiveSopId(null);
                        setActiveMode('dashboard');
                    }
                }
            };

            const getPolicyCatalog = () =>
                PCat().mergePolicyCatalog
                    ? PCat().mergePolicyCatalog(
                        DEFAULT_DOCUMENT_DATA.policyCatalog,
                        localPolicyData.policyCatalog
                    )
                    : (localPolicyData.policyCatalog || DEFAULT_DOCUMENT_DATA.policyCatalog);

            const updatePolicyCatalog = (nextCatalog) => {
                setLocalPolicyData((prev) => ({
                    ...prev,
                    policyCatalog: nextCatalog,
                }));
            };

            const getNavModel = () =>
                PCat().resolveNavModel
                    ? PCat().resolveNavModel(getPolicyCatalog(), {
                        handbook: localPolicyData.handbook,
                        sops: localPolicyData.sops,
                        standardDocs: localPolicyData.standardDocs,
                    })
                    : [];

            const removePolicyDraft = (key) => {
                if (!key || key === 'dashboard' || key === 'branding') return;
                const catalog = getPolicyCatalog();
                const isCustom = (catalog.customDocs || []).some((d) => d.key === key);
                let nextCatalog = catalog;
                if (isCustom) {
                    nextCatalog = PCat().removeCustomDoc(catalog, key);
                } else if (PCat().BUILTIN_KEYS?.includes(key)) {
                    nextCatalog = PCat().removeDefaultDoc(catalog, key);
                } else {
                    return;
                }

                setLocalPolicyData((prev) => {
                    const next = { ...prev, policyCatalog: nextCatalog };
                    if (key === 'handbook') {
                        // Keep handbook body for safety; catalog hides it from nav.
                        return next;
                    }
                    if (key === 'sops') {
                        next.sops = [];
                        return next;
                    }
                    if (key === 'jobDescriptions') {
                        next.standardDocs = {
                            ...(prev.standardDocs || {}),
                            jobDescriptions: {
                                ...(prev.standardDocs?.jobDescriptions || {}),
                                sections: [],
                            },
                        };
                        return next;
                    }
                    if (prev.standardDocs?.[key]) {
                        const { [key]: _drop, ...rest } = prev.standardDocs;
                        next.standardDocs = rest;
                    }
                    return next;
                });

                if (activeMode === key || (key === 'sops' && activeMode === 'sop') || (key === 'jobDescriptions' && activeMode === 'jobDescriptions')) {
                    setActiveMode('dashboard');
                    setActiveSopId(null);
                    setActiveJobRoleId(null);
                }
                triggerToast(`Removed “${PCat().getDocDef?.(key)?.title || key}” from this pack. Save to keep it gone.`);
            };

            const restorePolicyFromLibrary = (key) => {
                const catalog = PCat().restoreDefaultDoc(getPolicyCatalog(), key);
                const templatePack = JSON.parse(JSON.stringify(DEFAULT_DOCUMENT_DATA));
                setLocalPolicyData((prev) => {
                    const next = { ...prev, policyCatalog: catalog };
                    if (key === 'handbook') {
                        next.handbook = templatePack.handbook;
                    } else if (key === 'sops') {
                        next.sops = templatePack.sops;
                    } else if (templatePack.standardDocs?.[key]) {
                        next.standardDocs = {
                            ...(prev.standardDocs || {}),
                            [key]: templatePack.standardDocs[key],
                        };
                    }
                    return next;
                });
                triggerToast(`Restored “${PCat().getDocDef?.(key)?.title || key}” from the library.`);
            };

            const addBlankPolicyDraft = () => {
                const title = (newPolicyTitle || '').trim() || 'New Policy Draft';
                const { catalog, doc } = PCat().addCustomDoc(getPolicyCatalog(), {
                    title,
                    categoryId: newPolicyCategoryId || 'operations',
                    kind: 'chapters',
                });
                const body = PCat().createEmptyCustomPolicyDoc({ title, kind: 'chapters' });
                setLocalPolicyData((prev) => ({
                    ...prev,
                    policyCatalog: catalog,
                    standardDocs: {
                        ...(prev.standardDocs || {}),
                        [doc.key]: body,
                    },
                }));
                setNewPolicyTitle('');
                setShowCatalogModal(false);
                setActiveMode(doc.key);
                triggerToast(`Added draft “${title}”.`);
            };

            const addCatalogCategory = () => {
                const title = (newCategoryTitle || '').trim() || 'New Category';
                const { catalog } = PCat().addCategory(getPolicyCatalog(), {
                    title,
                    subtitle: (newCategorySubtitle || '').trim(),
                });
                updatePolicyCatalog(catalog);
                setNewCategoryTitle('');
                setNewCategorySubtitle('');
                triggerToast(`Added category “${title}”.`);
            };

            const removeCatalogCategory = (categoryId) => {
                updatePolicyCatalog(PCat().removeCategory(getPolicyCatalog(), categoryId));
                triggerToast('Category removed. Policies were moved to another category.');
            };

            const toggleNavCategory = (categoryId) => {
                setExpandedNavCategories((prev) => ({
                    ...prev,
                    [categoryId]: !(prev[categoryId] ?? true),
                }));
            };
            const usesChaptersForKey = (key) => docUsesChapters(key, getPolicyCatalog());
            const openNavItem = (item) => {
                if (!item) return;
                if (item.groupType === 'sops') {
                    openSopDocument(null);
                    return;
                }
                if (item.groupType === 'jobs') {
                    openJobRoleDocument(null);
                    return;
                }
                if (item.mode) setActiveMode(item.mode);
                else if (item.key) setActiveMode(item.key);
                else if (item.id) setActiveMode(item.id);
            };
            const navIconForKey = (key) => {
                const map = {
                    sops: Icons.FileText,
                    bcp: Icons.Activity,
                    healthSafety: Icons.HardHat,
                    sla: Icons.Target,
                    communicationPlan: Icons.Message,
                    handbook: Icons.BookOpen,
                    jobDescriptions: Icons.Briefcase,
                    onboarding: Icons.Users,
                    performanceReview: Icons.Target,
                    orgChart: Icons.Sitemap,
                    raci: Icons.Users,
                    managerialRoles: Icons.Briefcase,
                    conduct: Icons.Shield,
                    nda: Icons.Lock,
                    dataPrivacy: Icons.Database,
                };
                return map[key] || Icons.FileText;
            };
            const isCatalogProseMode = (mode) => {
                const prose = ['conduct', 'nda', 'dataPrivacy', 'healthSafety', 'bcp', 'sla', 'onboarding', 'performanceReview'];
                if (prose.includes(mode)) return true;
                return (getPolicyCatalog().customDocs || []).some((d) => d.key === mode);
            };
            const updateSOP = (id, field, val) => updateDocState('sops', sops => sops.map(s => s.id === id ? { ...s, [field]: val } : s));
            const updateSopDocControl = (id, field, val) => updateDocState('sops', sops => sops.map(s => s.id === id ? { ...s, docControl: { ...(s.docControl || { version: '1.0', effectiveDate: '', lastReviewed: '', owner: '' }), [field]: val } } : s));
            const updateSopRaci = (id, role, val) => updateDocState('sops', sops => sops.map(s => s.id === id ? { ...s, raci: { ...(s.raci || { responsible: '', accountable: '', consulted: '', informed: '' }), [role]: val } } : s));
            const addStep = (sopId) => updateDocState('sops', sops => sops.map(s => s.id === sopId ? { ...s, steps: [...(s.steps || []), { id: 'step-' + Date.now(), action: 'New Step', owner: '', duration: '', details: '' }] } : s));
            const removeStep = (sopId, stepId) => updateDocState('sops', sops => sops.map(s => s.id === sopId ? { ...s, steps: (s.steps || []).filter(st => st.id !== stepId) } : s));
            const updateStep = (sopId, stepId, field, val) => updateDocState('sops', sops => sops.map(s => s.id === sopId ? { ...s, steps: (s.steps || []).map(st => st.id === stepId ? { ...st, [field]: val } : st) } : s));
            const reorderStep = (sopId, sIdx, dir) => updateDocState('sops', sops => sops.map(s => s.id === sopId ? { ...s, steps: moveArrayItem(s.steps || [], sIdx, dir) } : s));

            const activeSop = useMemo(
                () => (localPolicyData.sops || []).find((s) => s.id === activeSopId) || null,
                [localPolicyData.sops, activeSopId]
            );
            const activeSopIndex = useMemo(() => {
                if (!activeSopId) return -1;
                return (localPolicyData.sops || []).findIndex((s) => s.id === activeSopId);
            }, [localPolicyData.sops, activeSopId]);

            // Handbook Handlers
            const updateHandbook = (field, val) => updateDocState('handbook', h => ({ ...h, [field]: val }));
            const updateHandbookDocControl = (field, val) => updateDocState('handbook', h => ({ ...h, docControl: { ...(h.docControl || { version: '1.0', effectiveDate: '', lastReviewed: '', owner: '' }), [field]: val } }));
            const updateHbArray = (arr, id, f, v) => updateDocState('handbook', h => ({ ...h, [arr]: (h[arr] || []).map(i => i.id === id ? { ...i, [f]: v } : i) }));
            const addCustomPolicy = () => updateDocState('handbook', h => ({ ...h, customPolicies: [...(h.customPolicies || []), { id: 'cp-' + Date.now(), title: 'New Policy', text: 'Details...' }] }));
            const removeCustomPolicy = (id) => updateDocState('handbook', h => ({ ...h, customPolicies: (h.customPolicies || []).filter(p => p.id !== id) }));
            
            const addLeave = () => updateDocState('handbook', h => ({ ...h, leaves: [...(h.leaves || []), { id: 'lv-' + Date.now(), name: 'New Leave', duration: '5 Days', condition: 'Standard allocations apply.' }] }));
            const removeLeave = (id) => updateDocState('handbook', h => ({ ...h, leaves: (h.leaves || []).filter(l => l.id !== id) }));
            
            const addDiscipline = () => updateDocState('handbook', h => ({ ...h, discipline: [...(h.discipline || []), { id: 'd-' + Date.now(), level: 'New Infraction Class', action: 'Assigned Sanction', details: 'Remediation details...' }] }));
            const removeDiscipline = (id) => updateDocState('handbook', h => ({ ...h, discipline: (h.discipline || []).filter(d => d.id !== id) }));

            const reorderHbArray = (arr, idx, dir) => updateDocState('handbook', h => ({ ...h, [arr]: moveArrayItem(h[arr] || [], idx, dir) }));

            // Standard Docs Handlers (Conduct, NDA, BCP, SLA, etc.)
            const updateStandardDoc = (key, field, val) => updateDocState('standardDocs', docs => ({ ...docs, [key]: { ...docs[key], [field]: val } }));
            const updateStandardDocControl = (key, field, val) => updateDocState('standardDocs', docs => ({
                ...docs,
                [key]: {
                    ...docs[key],
                    docControl: {
                        ...(docs[key]?.docControl || { version: '1.0', effectiveDate: '', lastReviewed: '', owner: '' }),
                        [field]: val
                    }
                }
            }));

            const patchStandardPolicyDoc = (key, mutator) => updateDocState('standardDocs', (docs) => {
                const current = docs[key] || {};
                const base = usesChaptersForKey(key) && PC().normalizeStandardPolicyDoc
                    ? PC().normalizeStandardPolicyDoc(current)
                    : current;
                const next = mutator(base);
                const normalized = usesChaptersForKey(key) && PC().normalizeStandardPolicyDoc
                    ? PC().normalizeStandardPolicyDoc(next)
                    : next;
                return { ...docs, [key]: normalized };
            });

            const updateStandardSection = (key, secId, field, val) => {
                if (!usesChaptersForKey(key)) {
                    return updateDocState('standardDocs', docs => ({
                        ...docs,
                        [key]: {
                            ...docs[key],
                            sections: (docs[key]?.sections || []).map((s) => (s.id === secId ? { ...s, [field]: val } : s)),
                        },
                    }));
                }
                return patchStandardPolicyDoc(key, (doc) => ({
                    ...doc,
                    chapters: (doc.chapters || []).map((ch) => ({
                        ...ch,
                        sections: (ch.sections || []).map((s) => (s.id === secId ? { ...s, [field]: val } : s)),
                    })),
                }));
            };

            const addStandardChapter = (key) => patchStandardPolicyDoc(key, (doc) => ({
                ...doc,
                chapters: [
                    ...(doc.chapters || []),
                    PC().createEmptyChapter?.() || {
                        id: 'ch-' + Date.now(),
                        title: 'Untitled chapter',
                        sections: [{ id: 'sec-' + Date.now(), title: 'Untitled section', content: '' }],
                    },
                ],
            }));

            const updateStandardChapter = (key, chapterId, field, val) => patchStandardPolicyDoc(key, (doc) => ({
                ...doc,
                chapters: (doc.chapters || []).map((ch) => (ch.id === chapterId ? { ...ch, [field]: val } : ch)),
            }));

            const removeStandardChapter = (key, chapterId) => patchStandardPolicyDoc(key, (doc) => {
                const chapters = (doc.chapters || []).filter((ch) => ch.id !== chapterId);
                return {
                    ...doc,
                    chapters: chapters.length
                        ? chapters
                        : [PC().createEmptyChapter?.({ title: 'Policy provisions' }) || { id: 'ch-main', title: 'Policy provisions', sections: [{ id: 'sec-' + Date.now(), title: 'Untitled section', content: '' }] }],
                };
            });

            const reorderStandardChapter = (key, idx, dir) => patchStandardPolicyDoc(key, (doc) => ({
                ...doc,
                chapters: moveArrayItem(doc.chapters || [], idx, dir),
            }));

            const addStandardSection = (key, chapterId, sectionOverrides) => {
                const fresh = PC().createEmptySection
                    ? PC().createEmptySection(sectionOverrides || {})
                    : { id: 'sec-' + Date.now(), title: 'Untitled section', kind: 'text', content: '' };
                if (!usesChaptersForKey(key)) {
                    return updateDocState('standardDocs', docs => ({
                        ...docs,
                        [key]: {
                            ...docs[key],
                            sections: [...(docs[key]?.sections || []), fresh],
                        },
                    }));
                }
                return patchStandardPolicyDoc(key, (doc) => {
                    const chapters = doc.chapters || [];
                    const targetId = chapterId || chapters[chapters.length - 1]?.id;
                    if (!targetId) {
                        return {
                            ...doc,
                            chapters: [PC().createEmptyChapter?.({ sections: [fresh] }) || { id: 'ch-' + Date.now(), title: 'Untitled chapter', sections: [fresh] }],
                        };
                    }
                    return {
                        ...doc,
                        chapters: chapters.map((ch) => (
                            ch.id === targetId ? { ...ch, sections: [...(ch.sections || []), fresh] } : ch
                        )),
                    };
                });
            };

            const addStandardTableSection = (key, chapterId) =>
                addStandardSection(key, chapterId, { kind: 'table', title: 'Untitled table' });

            const updateStandardSectionTable = (key, secId, table) => {
                const normalized = PC().normalizeTable ? PC().normalizeTable(table) : table;
                if (!usesChaptersForKey(key)) {
                    return updateDocState('standardDocs', docs => ({
                        ...docs,
                        [key]: {
                            ...docs[key],
                            sections: (docs[key]?.sections || []).map((s) =>
                                s.id === secId ? { ...s, kind: 'table', table: normalized, content: '' } : s
                            ),
                        },
                    }));
                }
                return patchStandardPolicyDoc(key, (doc) => ({
                    ...doc,
                    chapters: (doc.chapters || []).map((ch) => ({
                        ...ch,
                        sections: (ch.sections || []).map((s) =>
                            s.id === secId ? { ...s, kind: 'table', table: normalized, content: '' } : s
                        ),
                    })),
                }));
            };

            const removeStandardSection = (key, chapterId, secId) => {
                // Legacy flat-section callers pass (key, secId) only
                if (!usesChaptersForKey(key)) {
                    const legacySecId = secId == null ? chapterId : secId;
                    return updateDocState('standardDocs', docs => ({
                        ...docs,
                        [key]: {
                            ...docs[key],
                            sections: (docs[key]?.sections || []).filter((s) => s.id !== legacySecId),
                        },
                    }));
                }
                return patchStandardPolicyDoc(key, (doc) => ({
                    ...doc,
                    chapters: (doc.chapters || []).map((ch) => {
                        if (ch.id !== chapterId) return ch;
                        const nextSections = (ch.sections || []).filter((s) => s.id !== secId);
                        return {
                            ...ch,
                            sections: nextSections.length
                                ? nextSections
                                : [PC().createEmptySection?.() || { id: 'sec-' + Date.now(), title: 'Untitled section', content: '' }],
                        };
                    }),
                }));
            };

            const reorderStandardSection = (key, chapterIdOrIdx, idxOrDir, maybeDir) => {
                if (!usesChaptersForKey(key)) {
                    // Legacy: (key, idx, dir)
                    const idx = chapterIdOrIdx;
                    const dir = idxOrDir;
                    return updateDocState('standardDocs', docs => ({
                        ...docs,
                        [key]: {
                            ...docs[key],
                            sections: moveArrayItem(docs[key]?.sections || [], idx, dir),
                        },
                    }));
                }
                const chapterId = chapterIdOrIdx;
                const idx = idxOrDir;
                const dir = maybeDir;
                // At chapter edges, move the section into the neighboring chapter (Docs-like block move).
                return patchStandardPolicyDoc(key, (doc) => {
                    const chapters = [...(doc.chapters || [])];
                    const chIdx = chapters.findIndex((ch) => ch.id === chapterId);
                    if (chIdx < 0) return doc;
                    const sections = [...(chapters[chIdx].sections || [])];
                    if (dir === -1 && idx === 0 && chIdx > 0) {
                        const [moved] = sections.splice(0, 1);
                        if (!moved) return doc;
                        chapters[chIdx] = {
                            ...chapters[chIdx],
                            sections: sections.length
                                ? sections
                                : [PC().createEmptySection?.({ title: 'New section', content: '' }) || { id: 'sec-' + Date.now(), title: 'New section', content: '' }],
                        };
                        chapters[chIdx - 1] = {
                            ...chapters[chIdx - 1],
                            sections: [...(chapters[chIdx - 1].sections || []), moved],
                        };
                        return { ...doc, chapters };
                    }
                    if (dir === 1 && idx === sections.length - 1 && chIdx < chapters.length - 1) {
                        const [moved] = sections.splice(sections.length - 1, 1);
                        if (!moved) return doc;
                        chapters[chIdx] = {
                            ...chapters[chIdx],
                            sections: sections.length
                                ? sections
                                : [PC().createEmptySection?.({ title: 'New section', content: '' }) || { id: 'sec-' + Date.now(), title: 'New section', content: '' }],
                        };
                        chapters[chIdx + 1] = {
                            ...chapters[chIdx + 1],
                            sections: [moved, ...(chapters[chIdx + 1].sections || [])],
                        };
                        return { ...doc, chapters };
                    }
                    return {
                        ...doc,
                        chapters: chapters.map((ch) => (

                const toIdx = fromIdx + chapterDir;
                if (fromIdx < 0 || toIdx < 0 || toIdx >= chapters.length) return doc;
                const fromCh = chapters[fromIdx];
                const section = (fromCh.sections || []).find((s) => s.id === secId);
                if (!section) return doc;
                const nextFromSections = (fromCh.sections || []).filter((s) => s.id !== secId);
                chapters[fromIdx] = {

                    sections: nextFromSections.length
                        ? nextFromSections
                        : [PC().createEmptySection?.() || { id: 'sec-' + Date.now(), title: 'Untitled section', content: '' }],
                };

                    sections: [...(chapters[toIdx].sections || []), section],

                return { ...doc, chapters };

                const authUser = window.firebaseAuth?.currentUser;
                if (!authUser || !window.firebaseDb || !window.doc || !window.setDoc || !window.onSnapshot) {
                    reject(new Error('Sign in required to fetch a Google Doc URL. Or upload / paste a .txt export instead.'));
                    return;
                }
                const requestId = `gdoc-${authUser.uid.slice(0, 8)}-${Date.now()}`;
                const ref = window.doc(
                    window.firebaseDb,
                    'artifacts',
                    'kolthoff-admin-app',
                    'public',
                    'data',
                    'google_doc_import_requests',
                    requestId,
                );
                let settled = false;
                let unsub = () => {};
                const finish = (fn, value) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    try { unsub(); } catch { /* ignore */ }
                    fn(value);
                };
                const timer = setTimeout(() => {
                    finish(reject, new Error('Timed out waiting for Google Doc fetch. Use File → Download → Plain text (.txt) and upload instead.'));
                }, 45000);

                const attachListener = () => {
                    unsub = window.onSnapshot(
                        ref,
                        (snap) => {
                            const data = snap.data();
                            if (!data) return;
                            if (data.status === 'complete' && typeof data.text === 'string') {
                                finish(resolve, data.text);
                                return;
                            }
                            if (data.status === 'error') {
                                finish(reject, new Error(data.error || 'Google Doc fetch failed'));
                            }
                        },
                        (err) => {
                            const msg = String(err?.message || err || '');
                            if (/permission|insufficient/i.test(msg)) {
                                finish(reject, new Error('Could not listen for Google Doc fetch (permissions). Upload a .txt export instead.'));
                                return;
                            }
                            finish(reject, err instanceof Error ? err : new Error(msg));
                        },
                    );
                };

                // Create the request first, then listen — rules deny reads when resource is null
                // if we only check resource.data.requestedBy (listen-before-create used to fail silently).
                window.setDoc(ref, {
                    status: 'pending',
                    documentUrl: String(documentUrl || '').trim(),
                    requestedBy: authUser.uid,
                    requestedAt: Date.now(),
                }).then(() => {
                    if (settled) return;
                    attachListener();
                }).catch((err) => {
                    const msg = String(err?.message || err || '');
                    if (/permission|insufficient/i.test(msg)) {
                        finish(reject, new Error('Could not start Google Doc fetch (permissions). Sign in as staff, or upload a .txt export instead.'));
                        return;

                    finish(reject, err instanceof Error ? err : new Error(msg));

                    const fsMsg = String(fsErr?.message || fsErr || '');
                    // Do not fall through for user/share/auth failures — HTTP/callable are usually 403 here too
                    if (/share as anyone|not accessible|valid google docs|timed out|sign in required|permissions|login page|\.txt/i.test(fsMsg)) {
                        throw fsErr instanceof Error ? fsErr : new Error(fsMsg);
                    }
                    console.warn('Firestore Google Doc fetch failed, trying API fallback', fsErr);
                }

                if (typeof fetch === 'function') {
                    try {
                        const res = await fetch('/api/fetchGoogleDocText', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ documentUrl }),
                        });
                        const payload = await res.json().catch(() => ({}));
                        if (res.ok && payload?.text) return payload.text;
                        if (payload?.error) throw new Error(payload.error);
                        if (!res.ok) {
                            throw new Error(
                                res.status === 403
                                    ? 'URL fetch API is blocked by cloud permissions. Upload a .txt export instead (Google Docs → File → Download → Plain text).'
                                    : `URL fetch failed (HTTP ${res.status}). Upload a .txt export instead.`,
                            );
                        }
                    } catch (apiErr) {
                        if (apiErr?.message && !/failed to fetch|network/i.test(apiErr.message)) throw apiErr;
                    }

                if (window.httpsCallable && window.firebaseFunctions) {
                    try {
                        const fn = window.httpsCallable(window.firebaseFunctions, 'fetchGoogleDocText');
                        const result = await fn({ documentUrl });
                        if (result.data?.text) return result.data.text;
                    } catch (callableErr) {
                        const msg = callableErr?.message || String(callableErr || '');
                        if (/cors|permission|unauthenticated|forbidden|403/i.test(msg)) {
                            throw new Error('URL fetch is blocked by cloud permissions. Upload a .txt export instead (Google Docs → File → Download → Plain text).');
