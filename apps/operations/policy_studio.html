        const DrawIoEmbed = ({ preset = 'orgChart', xml, onXmlChange, onSvgExport, height = 520 }) => {
            const iframeRef = useRef(null);
            const readyRef = useRef(false);
            const configuredRef = useRef(false);
            const pendingXmlRef = useRef(xml);

            const postAction = (payload) => {
                iframeRef.current?.contentWindow?.postMessage(JSON.stringify(payload), '*');
            };

            const sendLoad = (diagramXml) => {
                const blank = preset === 'bpmn'
                    ? (window.DiagramEditor?.BLANK_BPMN_XML || '')
                    : (window.DiagramEditor?.BLANK_ORG_CHART_XML || '');
                postAction({
                    action: 'load',
                    xml: diagramXml || blank,
                    autosave: 1,
                });
            };

            const requestExport = (format) => {
                postAction({
                    action: 'export',
                    format,
                    xml: format === 'xml',
                    spin: 'Exporting diagram…',
                });
            };

            useEffect(() => {
                pendingXmlRef.current = xml;
                if (readyRef.current && configuredRef.current) sendLoad(xml);
            }, [xml]);

            useEffect(() => {
                const handler = (evt) => {
                    if (!evt.data || typeof evt.data !== 'string') return;
                    let msg;
                    try { msg = JSON.parse(evt.data); } catch { return; }

                    if (msg.event === 'configure') {
                        configuredRef.current = true;
                        postAction({
                            action: 'configure',
                            config: window.DiagramEditor?.getPreset(preset)?.configure || {},
                        });
                    }
                    if (msg.event === 'init') {
                        readyRef.current = true;
                        sendLoad(pendingXmlRef.current);
                    }
                    if (msg.event === 'export') {
                        if (msg.format === 'xml' && msg.xml && onXmlChange) onXmlChange(msg.xml);
                        if ((msg.format === 'xmlsvg' || msg.format === 'svg') && msg.data && onSvgExport) onSvgExport(msg.data);
                    }
                    if (msg.event === 'autosave' && msg.xml && onXmlChange) onXmlChange(msg.xml);
                };
                window.addEventListener('message', handler);
                return () => window.removeEventListener('message', handler);
            }, [preset, onXmlChange, onSvgExport]);

            return (
                <div className="flex flex-col gap-3">
                    <div className="flex flex-wrap gap-2 no-print">
                        <button
                            type="button"
                            onClick={() => { requestExport('xml'); requestExport('xmlsvg'); }}
                            className="text-[10px] font-bold uppercase bg-brandTeal-500 hover:bg-brandTeal-600 text-brandNavy-955 px-3 py-1.5 rounded-lg transition-colors"
                        >
                            Apply Diagram to Policy
                        </button>
                    </div>
                    <iframe
                        ref={iframeRef}
                        src={window.DiagramEditor?.getDrawioEmbedUrl() || 'https://embed.diagrams.net/?embed=1&proto=json&configure=1'}
                        className="w-full border border-brandNavy-800 rounded-xl bg-white"
                        style={{ height }}
                        title="draw.io diagram editor"
                    />
                </div>
            );
        };

        const moveArrayItem = (arr, index, direction) => {
            const newArr = [...arr];
            if (direction === -1 && index > 0) {
                [newArr[index], newArr[index - 1]] = [newArr[index - 1], newArr[index]];
            } else if (direction === 1 && index < newArr.length - 1) {
                [newArr[index], newArr[index + 1]] = [newArr[index + 1], newArr[index]];
            }
            return newArr;
        };

        const renderMarkdown = (markdownString) => {
            try {
                if (window.marked) {
                    if (typeof window.marked.parse === 'function') {
                        return window.marked.parse(markdownString || '');
                    } else if (typeof window.marked === 'function') {
                        return window.marked(markdownString || '');
                    }
                }
                return markdownString || '';
            } catch (e) {
                console.error("Markdown parse error", e);
                return markdownString || '';
            }
        };

        const AutoResizeTextarea = ({ id, value, onChange, placeholder, className, isEditMode }) => {
            const textareaRef = useRef(null);

            const adjustHeight = () => {
                const element = textareaRef.current;
                if (element) {
                    element.style.height = 'auto';
                    element.style.height = `${element.scrollHeight}px`;
                }
            };

            useEffect(() => {
                if (isEditMode) {
                    adjustHeight();
                }
            }, [value, isEditMode]);

            useEffect(() => {
                if (isEditMode) {
                    const timer = setTimeout(adjustHeight, 50);
                    return () => clearTimeout(timer);
                }
            }, [isEditMode]);

        const MarkdownField = ({ id, value, onChange, placeholder, className, isEditMode }) => {
            const fileRef = useRef();
            const textareaRef = useRef(null);

            const adjustHeight = () => {
                const element = textareaRef.current;
                if (element) {
                    element.style.height = 'auto';
                    element.style.height = `${element.scrollHeight}px`;
                }
            };

            useEffect(() => {
                if (isEditMode) {
                    adjustHeight();
                }
            }, [value, isEditMode]);

            useEffect(() => {
                if (isEditMode) {
                    const timer = setTimeout(adjustHeight, 50);
                    return () => clearTimeout(timer);
                }
            }, [isEditMode]);

            const handleFile = (e) => {
                if(!e.target.files[0]) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let scaleSize = 1;
                        if(img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        onChange(value + `\n\n![Embedded Image](${canvas.toDataURL('image/jpeg', 0.8)})\n\n`);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            };

            if (!isEditMode) {
                return <div id={id} className={`markdown-body ${className}`} dangerouslySetInnerHTML={{ __html: renderMarkdown(value) }} />;
            }

            return (
                <div className="relative group/md rounded border border-transparent hover:border-slate-200 focus-within:border-brandTeal-404 bg-white">

                        id={id}

            // 1) Auth Setup - Bypassed in standalone, bound strictly to current browser origin

                                try {
                                    if (await window.hasAdminSession()) return true;

                                    /* continue */
                                }
                            }
                            const email = authUser.email?.toLowerCase();
                            const isGoogle = authUser.providerData?.some((p) => p.providerId === 'google.com');
                            return Boolean(isGoogle && email?.endsWith('@kolthoff-consulting.com'));

            // Smart Data Merger to safeguard against ReferenceErrors or blank canvases

            const inferToastTone = (msg) => {

                if (text.startsWith('⚠')) return 'warning';

                    `;

            const compilePoliciesForVault = () => {
                const policiesArray = [];
                const defaultDate = new Date().toISOString().split('T')[0];

                if (localPolicyData.sops) {
                    localPolicyData.sops.forEach(sop => {
                        let mdContent = `# ${sop.title}\n\n`;
                        if (sop.docControl?.owner) mdContent += `**Owner:** ${sop.docControl.owner}`;
                        if (sop.docControl?.version) mdContent += ` · **Version:** ${sop.docControl.version}`;
                        if (sop.docControl?.effectiveDate) mdContent += ` · **Effective:** ${sop.docControl.effectiveDate}`;
                        mdContent += `\n\n`;
                        if (sop.objective) mdContent += `## Purpose\n${sop.objective}\n\n`;
                        if (sop.scope) mdContent += `## Applies to\n${sop.scope}\n\n`;
                        if (sop.prerequisites?.trim()) mdContent += `## Before you start\n${sop.prerequisites}\n\n`;
                        if (sop.diagram?.svgCache) mdContent += `## Process diagram\n![Process diagram](${sop.diagram.svgCache})\n\n`;
                        if (sop.steps && sop.steps.length > 0) {
                            mdContent += `## Steps\n`;
                            sop.steps.forEach((step, idx) => {
                                mdContent += `**${idx + 1}. ${step.action}**\n*Who: ${step.owner || '—'} · Time: ${step.duration || '—'}*\n${step.details || ''}\n\n`;

                        }
                        if (sop.kpis?.trim()) mdContent += `## Done when\n${sop.kpis}\n\n`;
                        if (sop.troubleshooting?.trim()) mdContent += `## If something goes wrong\n${sop.troubleshooting}\n\n`;
                        if (sop.raci && (sop.raci.responsible || sop.raci.accountable)) {
                            mdContent += `## Roles (RACI)\n`;
                            mdContent += `- **Responsible:** ${sop.raci.responsible || '—'}\n`;
                            mdContent += `- **Accountable:** ${sop.raci.accountable || '—'}\n`;
                            if (sop.raci.consulted) mdContent += `- **Consulted:** ${sop.raci.consulted}\n`;
                            if (sop.raci.informed) mdContent += `- **Informed:** ${sop.raci.informed}\n`;
                            mdContent += `\n`;
                        }

                        policiesArray.push({
                            id: sop.id || makeSopId(),
                            title: sop.title || 'Standard Operating Procedure',
                            content: mdContent.trim(),
                            lastUpdated: sop.docControl?.lastReviewed || defaultDate
                        });
                    });
                }

                if (localPolicyData.handbook) {
                    let mdContent = `# ${localPolicyData.handbook.title || 'Employee Handbook'}\n\n`;
                    if (localPolicyData.handbook.introduction) mdContent += `## Introduction\n${localPolicyData.handbook.introduction}\n\n`;
                    if (localPolicyData.handbook.timekeeping) mdContent += `## Hours & Attendance\n${localPolicyData.handbook.timekeeping}\n\n`;
                    if (localPolicyData.handbook.compensation) mdContent += `## Pay & Benefits\n${localPolicyData.handbook.compensation}\n\n`;
                    if (localPolicyData.handbook.offboarding) mdContent += `## Resignation & Offboarding\n${localPolicyData.handbook.offboarding}\n\n`;

                    if (localPolicyData.handbook.leaves && localPolicyData.handbook.leaves.length > 0) {
                        mdContent += `## Leave\n`;
                        localPolicyData.handbook.leaves.forEach(l => {
                            mdContent += `- **${l.name}** (${l.duration}): ${l.condition}\n`;

                        if (doc.introduction) mdContent += `## Introduction\n${doc.introduction}\n\n`;

                        if (doc.sections && doc.sections.length > 0) {
                            doc.sections.forEach((sec, idx) => {

            const handlePublishToVault = async () => {

            const fetchGoogleDocTextViaFirestore = (documentUrl) => new Promise((resolve, reject) => {
                const authUser = window.firebaseAuth?.currentUser;
                if (!authUser || !window.firebaseDb || !window.doc || !window.setDoc || !window.onSnapshot) {
                    reject(new Error('Sign in required to fetch a Google Doc URL. Or upload / paste a .txt export instead.'));
                    return;
                }
                const requestId = `gdoc-${authUser.uid.slice(0, 8)}-${Date.now()}`;
                const ref = window.doc(
                    window.firebaseDb,
                    'artifacts',
                    'kolthoff-admin-app',
                    'public',
                    'data',
                    'google_doc_import_requests',
                    requestId,
                );
                let settled = false;
                let unsub = () => {};
                const finish = (fn, value) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    try { unsub(); } catch { /* ignore */ }
                    fn(value);
                };
                const timer = setTimeout(() => {
                    finish(reject, new Error('Timed out waiting for Google Doc fetch. Use File → Download → Plain text (.txt) and upload instead.'));
                }, 45000);

                unsub = window.onSnapshot(
                    ref,
                    (snap) => {
                        const data = snap.data();
                        if (!data) return;
                        if (data.status === 'complete' && typeof data.text === 'string') {
                            finish(resolve, data.text);
                            return;
                        }
                        if (data.status === 'error') {
                            finish(reject, new Error(data.error || 'Google Doc fetch failed'));
                        }
                    },
                    (err) => finish(reject, err),
                );

                window.setDoc(ref, {
                    status: 'pending',
                    documentUrl: String(documentUrl || '').trim(),
                    requestedBy: authUser.uid,
                    requestedAt: Date.now(),
                }).catch((err) => finish(reject, err));
            });

            const fetchGoogleDocText = async (documentUrl) => {
                // Primary: Firestore trigger (works when org policy blocks public Cloud Function invoke)
                try {
                    return await fetchGoogleDocTextViaFirestore(documentUrl);
                } catch (fsErr) {
                    const fsMsg = String(fsErr?.message || fsErr || '');
                    // Fall through to HTTP/callable only for infra/setup issues, not share/access errors
                    if (/share as anyone|not accessible|valid google docs|timed out|sign in required/i.test(fsMsg)) {
                        throw fsErr instanceof Error ? fsErr : new Error(fsMsg);
                    }
                    console.warn('Firestore Google Doc fetch failed, trying API fallback', fsErr);
                }

                if (typeof fetch === 'function') {
                    try {
                        const res = await fetch('/api/fetchGoogleDocText', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ documentUrl }),
                        });
                        const payload = await res.json().catch(() => ({}));
                        if (res.ok && payload?.text) return payload.text;
                        if (payload?.error) throw new Error(payload.error);
                        if (!res.ok) {
                            throw new Error(
                                res.status === 403
                                    ? 'URL fetch API is blocked by cloud permissions. Upload a .txt export instead (Google Docs → File → Download → Plain text).'
                                    : `URL fetch failed (HTTP ${res.status}). Upload a .txt export instead.`,
                            );
                        }
                    } catch (apiErr) {
                        if (apiErr?.message && !/failed to fetch|network/i.test(apiErr.message)) throw apiErr;
                    }
                }
                if (window.httpsCallable && window.firebaseFunctions) {
                    try {
                        const fn = window.httpsCallable(window.firebaseFunctions, 'fetchGoogleDocText');
                        const result = await fn({ documentUrl });
                        if (result.data?.text) return result.data.text;
                    } catch (callableErr) {
                        const msg = callableErr?.message || String(callableErr || '');
                        if (/cors|permission|unauthenticated|forbidden|403/i.test(msg)) {
                            throw new Error('URL fetch is blocked by cloud permissions. Upload a .txt export instead (Google Docs → File → Download → Plain text).');
                        }
                        throw callableErr instanceof Error ? callableErr : new Error(msg);

                                        </button>
                                    </div>
                                    <p className="text-[10px] text-slate-500">Requires <strong className="text-slate-400">Anyone with the link can view</strong>. If Fetch Doc fails, use upload/paste below (File → Download → Plain text).</p>
                                </div>

                                <div className="space-y-2">
                                    <label htmlFor="doc-import-file" className="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Or upload export (.txt / .md / .html)</label>
                                    <input
                                        id="doc-import-file"
                                        type="file"
                                        accept=".txt,.md,.markdown,.html,.htm,text/plain,text/markdown,text/html"
                                        onChange={(e) => handleDocImportFromFile(e.target.files?.[0])}
                                        disabled={docImportBusy}
                                        className="block w-full text-[11px] text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:uppercase file:bg-brandNavy-800 file:text-brandTeal-400 hover:file:bg-brandNavy-700"
                                    />
                                </div>

                                <div className="space-y-2">
                                    <label htmlFor="doc-import-paste" className="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Or paste text</label>
                                    <textarea
                                        id="doc-import-paste"
                                        value={docImportPaste}
                                        onChange={(e) => setDocImportPaste(e.target.value)}
                                        rows={5}
                                        placeholder="# Code of Conduct&#10;&#10;Introduction…&#10;&#10;## Dress code&#10;…"
                                        className="w-full bg-brandNavy-900 border border-brandNavy-700 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-brandTeal-500 font-mono"
                                        disabled={docImportBusy}
                                    />
                                    <button
                                        type="button"
                                        onClick={handleDocImportFromPaste}
                                        disabled={docImportBusy}
                                        className="text-[10px] font-bold uppercase bg-brandNavy-900 border border-brandNavy-700 text-slate-300 px-3 py-1.5 rounded-lg hover:border-brandTeal-500/40 disabled:opacity-50"
                                    >
                                        Parse paste
                                    </button>
                                </div>

                                {docImportStatus && (
                                    <p className={`text-[11px] leading-relaxed ${docImportPreview ? 'text-brandTeal-400' : 'text-amber-300/90'}`}>{docImportStatus}</p>
                                )}

                                {docImportPreview && (
                                    <div className="rounded-lg border border-brandNavy-700 bg-brandNavy-900/80 p-3 space-y-2">
                                        <p className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Preview</p>
                                        <p className="text-xs text-slate-200"><span className="text-slate-500">Title:</span> {docImportPreview.title || '(keep current)'}</p>
                                        <p className="text-[11px] text-slate-400 line-clamp-3 whitespace-pre-wrap">{docImportPreview.introduction || '(empty introduction)'}</p>
                                        <ul className="text-[11px] text-slate-400 list-disc pl-4 space-y-0.5">
                                            {(docImportPreview.sections || []).slice(0, 8).map((s) => (
                                                <li key={s.id}>{s.title}</li>
                                            ))}
                                            {(docImportPreview.sections || []).length > 8 && (
                                                <li>+{(docImportPreview.sections || []).length - 8} more…</li>
                                            )}
                                        </ul>
                                        <label className="flex items-center gap-2 text-[11px] text-slate-300 cursor-pointer pt-1">
                                            <input
                                                type="checkbox"
                                                checked={docImportUpdateTitle}
                                                onChange={(e) => setDocImportUpdateTitle(e.target.checked)}
                                                className="rounded border-brandNavy-600"
                                            />
                                            Update document title from import
                                        </label>
                                    </div>
                                )}

                                <div className="pt-2 border-t border-brandNavy-800 flex justify-end gap-2">
                                    <button type="button" onClick={closeDocImportModal} className="px-4 py-1.5 bg-brandNavy-900 hover:bg-brandNavy-850 text-xs font-bold uppercase rounded border border-brandNavy-800 text-slate-300">Cancel</button>
                                    <button
                                        type="button"
                                        onClick={applyDocImportPreview}
                                        disabled={!docImportPreview || docImportBusy}
                                        className="px-4 py-1.5 bg-brandTeal-600 hover:bg-brandTeal-500 text-xs font-bold uppercase rounded text-brandNavy-955 shadow-lg transition-all disabled:opacity-40 disabled:pointer-events-none"
                                    >
                                        Apply to draft
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Reset Document Template Confirmation Modal */}
                    {showResetConfirmModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm no-print" onPointerDown={() => setShowResetConfirmModal(false)}>
                            <div 
                                className="w-[450px] bg-brandNavy-955 border border-brandNavy-800 border-t-4 border-t-rose-500 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] p-6 text-left animate-pop-in text-white font-sans flex flex-col gap-4"
                                onPointerDown={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center border-b border-brandNavy-800 pb-3">
                                    <div className="flex items-center gap-2 text-rose-400">
                                        <Icons.Reset />
                                        <h3 className="text-sm font-bold uppercase tracking-widest text-white">Reset Document to Template</h3>
                                    </div>
                                    <button onClick={() => setShowResetConfirmModal(false)} className="text-slate-400 hover:text-white transition-colors cursor-pointer"><Icons.Close /></button>
                                </div>
                                
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    Are you sure you want to reset <strong>{getActiveDocTitle()}</strong> to the default compliance template? This will replace your current edits with the latest system draft.
                                </p>

                                <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg text-rose-300 text-[11px] leading-relaxed font-semibold">
                                    ⚠️ Warning: This action is local and temporary until you click "Save to Cloud". If you proceed and save, your previous custom edits for this document will be permanently overwritten.
                                </div>

                                <div className="pt-2 border-t border-brandNavy-800 flex justify-end gap-2">
                                    <button onClick={() => setShowResetConfirmModal(false)} className="px-4 py-1.5 bg-brandNavy-900 hover:bg-brandNavy-850 text-xs font-bold uppercase rounded border border-brandNavy-800 text-slate-300">Cancel</button>
                                    <button onClick={handleResetToDefault} className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-xs font-bold uppercase rounded text-white shadow-lg transition-all">Reset to Template</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bulk Workspace Reset Confirmation Modal */}
                    {showBulkResetModal && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-sm no-print" onPointerDown={() => setShowBulkResetModal(false)}>
                            <div 
                                className="w-[480px] bg-brandNavy-955 border border-brandNavy-800 border-t-4 border-t-rose-600 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] p-6 text-left animate-pop-in text-white font-sans flex flex-col gap-4"
                                onPointerDown={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center border-b border-brandNavy-800 pb-3">
                                    <div className="flex items-center gap-2 text-rose-505">
                                        <Icons.Reset />
                                        <h3 className="text-sm font-bold uppercase tracking-widest text-white">Reset All Workspace Documents</h3>
                                    </div>
                                    <button onClick={() => setShowBulkResetModal(false)} className="text-slate-400 hover:text-white transition-colors cursor-pointer"><Icons.Close /></button>
                                </div>
                                
                                <p className="text-xs text-slate-400 leading-relaxed font-semibold">
                                    This action will reset ALL 10 policy documents in this active workspace (SOPs, Handbook, Conduct, NDA, BCP, SLA, etc.) back to their latest system-defined compliance drafts.
                                </p>

                                <div className="p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg text-rose-300 text-[11px] leading-relaxed font-semibold">
                                    ⚠️ Critical Warning: This operation applies to all policies simultaneously. To write these updates to the cloud, you must click "Save to Cloud" after resetting. This is ideal if you have older workspaces that you want to upgrade to our brand-new comprehensive templates.
                                </div>

                                <div className="pt-2 border-t border-brandNavy-800 flex justify-end gap-2">
                                    <button onClick={() => setShowBulkResetModal(false)} className="px-4 py-1.5 bg-brandNavy-900 hover:bg-brandNavy-850 text-xs font-bold uppercase rounded border border-brandNavy-800 text-slate-300">Cancel</button>
                                    <button onClick={handleBulkResetToDefault} className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-xs font-bold uppercase rounded text-white shadow-lg transition-all">Reset All to Templates</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
